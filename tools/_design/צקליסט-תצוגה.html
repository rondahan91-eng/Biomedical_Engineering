<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תצוגת הצ׳קליסט</title>
<!-- הגיליון נטען ב-fetch ולא ב-link במכוון: ל-link הדפדפן מגיש עותק מהמטמון,
     וכאן בודקים דווקא את הקובץ שנכתב עכשיו. זה דף תצוגה, לא דף לתלמידים. -->
<style>
  body{background:#eef4f7;margin:0;padding:0}
  .bar{background:#0f2231;color:#cfe3ee;padding:10px 16px;display:flex;gap:10px;
       align-items:center;flex-wrap:wrap;font-size:13px}
  .bar b{color:#fff}
  .seg{display:inline-flex;border:1px solid #2b4a60;border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:#cfe3ee;padding:5px 11px;font:inherit;
              cursor:pointer;border-radius:0}
  .seg button.on{background:#fff;color:#0f2231;font-weight:700}
  .wrap{display:grid;grid-template-columns:310px 1fr;gap:18px;padding:18px;align-items:start}
  .pane{background:#fff;border:1px solid #dce7ee;border-radius:12px;padding:14px}
  .pane > h3{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#8aa2b3}
  .note{padding:8px 16px;font-size:12.5px;color:#54707f;background:#f6f9fb;border-bottom:1px solid #dce7ee}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar">
  <b>תצוגת הצ׳קליסט</b>
  <span class="seg" id="tplSeg"></span>
  <span class="seg" id="stageSeg"></span>
  <span class="seg" id="gateSeg"></span>
  <span id="count"></span>
</div>
<p class="note">
  מצייר את <b>js/checklist.js</b> האמיתי מול התבניות האמיתיות מתוך
  <b>backend/Code.gs</b>. הסימונים כאן מקומיים ואינם נשמרים בשום מקום — זו
  תצוגה, לא המערכת. לחיצה על סעיף פותחת אותו.
</p>
<div class="wrap">
  <div class="pane"><h3>כך זה נראה במסילה</h3><aside class="rail" id="rail"></aside></div>
  <div class="pane"><h3>כך זה נראה בחלון "משימת השבוע"</h3><div id="modal"></div></div>
</div>

<script type="module">
import { checklistCardHtml, checklistModalHtml, wireChecklist } from '../../js/checklist.js';

const sheet = document.createElement('style');
sheet.textContent = await (await fetch('../../css/style.css?v=' + Math.random())).text();
document.head.insertBefore(sheet, document.head.firstChild);

const src = await (await fetch('../../backend/Code.gs?v=' + Math.random())).text();

// ---- אותם בדלים כמו ב-backend/tests/checklist.test.html -------------------
const DB = {};
const mkSheet = (name) => ({
  getDataRange: () => ({ getValues: () => DB[name] || [[]] }),
  getRange: (r, c, nr, nc) => ({ getValues: () => [(DB[name][r - 1] || []).slice(c - 1, c - 1 + nc)] }),
  getLastColumn: () => (DB[name][0] || []).length,
  getLastRow: () => (DB[name] || []).length,
  setFrozenRows: () => {}, appendRow: (row) => { DB[name].push(row); },
});
let GATE = 'on';
const stubs = {
  SpreadsheetApp: { getActiveSpreadsheet: () => ({
    getSheetByName: (n) => (DB[n] ? mkSheet(n) : null),
    insertSheet: (n) => { DB[n] = []; return mkSheet(n); } }) },
  PropertiesService: { getScriptProperties: () => ({
    getProperty: (k) => (k === 'CHECKLIST_GATE' ? GATE : null) }) },
  Utilities: { getUuid: () => 'abcdef', formatDate: () => '' },
  Session: { getScriptTimeZone: () => 'Asia/Jerusalem' },
  Logger: { log: () => {} }, DriveApp: {}, CacheService: {}, LockService: {}, UrlFetchApp: {},
};
const names = Object.keys(stubs);
const api = new Function(...names, src + `
  ; return { weeklyChecklist, CHECKLIST_TEMPLATES, SHEET_SCHEMAS,
             SHEET_PLANS, SHEET_PROGRESS };`)(...names.map(n => stubs[n]));

[api.SHEET_PLANS, api.SHEET_PROGRESS].forEach(n => { DB[n] = [api.SHEET_SCHEMAS[n].slice()]; });

// ---- מצב התצוגה ----------------------------------------------------------
let tpl = 'dossier', stage = 1, rev = 0;
const ctx = {
  firstName: 'מיכל', weekNumber: 7, checkInEnabled: true,
  topicText: 'תיק ההערכה של המודל שלי',
  trainerUrl: 'https://teachablemachine.withgoogle.com/train/image',
  tools: [{ key: 'notebook', path: '../notebook/' }, { key: 'evaluate', path: '../evaluate/' }],
};
const state = { checklist: null, openItem: '', noteDraft: {}, tickBusy: '' };

const setPlan = () => DB[api.SHEET_PLANS].push(['P' + (++rev), 'י1', 7, rev, tpl, new Date(), 'admin']);
setPlan();

function compute() {
  const prog = DB[api.SHEET_PROGRESS].slice(1).map((r, i) => {
    const o = {}; api.SHEET_SCHEMAS[api.SHEET_PROGRESS].forEach((h, j) => o[h] = r[j]);
    o.__row = i + 2; return o; });
  state.checklist = api.weeklyChecklist('S1', { studentId: 'S1', group: 'י1' },
    { weekNumber: 7, checkIn: true }, stage, false, [], [], prog);
}

// הסימון כאן מקומי: כותב ל"גיליון" שבזיכרון ומחשב מחדש, בלי שרת.
function onTick(itemId, done, note) {
  DB[api.SHEET_PROGRESS].push(['E' + DB[api.SHEET_PROGRESS].length, 'S1', 7, itemId,
    done ? 'done' : 'open', 'self', note || '', new Date(), 'S1']);
  render();
}

const segs = [
  { el: 'tplSeg', opts: [['dossier', 'תיק ההערכה'], ['curve', 'עקומת למידה']],
    get: () => tpl, set: v => { tpl = v; setPlan(); } },
  { el: 'stageSeg', opts: [['1', 'שלב 1'], ['2', 'שלב 2']],
    get: () => String(stage), set: v => { stage = Number(v); } },
  { el: 'gateSeg', opts: [['on', 'חוסם'], ['off', 'ייעוץ בלבד']],
    get: () => (GATE === 'on' ? 'on' : 'off'), set: v => { GATE = v === 'on' ? 'on' : null; } },
];

function render() {
  compute();
  segs.forEach(s => {
    document.getElementById(s.el).innerHTML = s.opts.map(([v, t]) =>
      `<button data-seg="${s.el}" data-v="${v}"${s.get() === v ? ' class="on"' : ''}>${t}</button>`).join('');
  });
  const cl = state.checklist;
  document.getElementById('count').textContent =
    cl ? `${cl.gateDone}/${cl.gateTotal} חוסמות · ${cl.blocked ? 'הצ׳ק-אין נעול' : 'הצ׳ק-אין פתוח'}` : '';
  document.getElementById('rail').innerHTML = checklistCardHtml(ctx, state);
  document.getElementById('modal').innerHTML = checklistModalHtml(ctx, state);

  document.querySelectorAll('[data-seg]').forEach(b => b.addEventListener('click', () => {
    segs.find(s => s.el === b.dataset.seg).set(b.dataset.v);
    state.openItem = '';
    render();
  }));
  wireChecklist(document, ctx, state, onTick);
}
render();
</script>
</body>
</html>
