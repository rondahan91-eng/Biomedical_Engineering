<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המעבדה — דמו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   המעבדה — מסך אחד, משימה אחת.
   הכלל היחיד כאן: מה שלא צריך עכשיו אינו על המסך. ההסברים, המספרים
   והמלכודות קיימים — אבל נפתחים, לא מוצגים.
   שפת העיצוב נמדדה מתוך מצגת "עקומות למידה".
   ========================================================================== */
:root{
  --bg:#f6f9fb; --surface:#fff; --surface-2:#f1f6f9; --surface-3:#e7eff4;
  --line:#e0e9f0; --line-2:#ccdae5;
  --ink:#0d1f2b; --ink-2:#4a6478; --ink-3:#8aa2b3;
  --brand:#0891b2; --brand-2:#0e7490; --accent:#14b8a6;
  --ok:#059669; --warn:#b45309; --err:#dc2626;
  --font:'Heebo','Assistant','Segoe UI',Arial,sans-serif;
  --mono:'JetBrains Mono','Consolas',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;flex-direction:column;overflow:hidden}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;
  color:var(--ink-3);text-transform:uppercase;display:block;direction:ltr;text-align:right}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;
  transition:border-color .13s,background .13s,color .13s}
button:hover:not(:disabled){border-color:var(--ink);}
button:disabled{opacity:.35;cursor:not-allowed}
button.go{background:var(--ink);color:#fff;border-color:var(--ink);padding:11px 26px}
button.go:hover:not(:disabled){background:var(--brand-2);border-color:var(--brand-2)}
button.quiet{border-color:transparent;color:var(--ink-3);font-weight:500}
button.quiet:hover{color:var(--ink);border-color:transparent}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:9px;padding:12px 14px;width:100%;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}

/* ---------------- כותרת: ניווט בלבד, אפס תוכן ---------------- */
header{height:56px;flex:none;display:flex;align-items:center;gap:18px;
  padding:0 26px;background:var(--surface);border-bottom:1px solid var(--line)}
header .wk{font-weight:900;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
#steps{display:flex;gap:5px;margin-inline-start:auto;margin-inline-end:auto}
#steps button{border:0;background:transparent;padding:4px 2px;border-radius:0}
/* עיגול ממוספר, ו-וי ירוק כשהשלב הושלם. קו בלי מספר לא אמר לאן הגענו. */
#steps b{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);font-style:normal}
#steps button.done b{background:var(--ok);border-color:var(--ok);color:#fff}
#steps button.on b{background:var(--ink);border-color:var(--ink);color:#fff}
#steps button.on.done b{background:var(--ok);border-color:var(--ok)}
#steps button.lock b{background:var(--surface-2);border-color:var(--line);color:var(--surface-3)}
#steps button:disabled{cursor:not-allowed}
header .who{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* ---------------- במה ---------------- */
main{flex:1;min-height:0;overflow-y:auto;display:flex;justify-content:center}
.stage{width:100%;max-width:960px;padding:32px 30px 16px;animation:in .22s ease-out}
/* רק אטימות. translateY בתוך מיכל גלילה מוסיף 6px של גלילה אמיתית, ומספיק
   כדי שפס גלילה יופיע על מסך שאמור להיות מסך אחד. */
@keyframes in{from{opacity:0}to{opacity:1}}
.stage h1{margin:7px 0 0;font-size:40px;font-weight:900;line-height:1.14;letter-spacing:-.6px}
.stage .lede{margin:12px 0 0;font-size:19px;font-weight:500;color:var(--ink-2);line-height:1.52;max-width:720px}
.work{margin-top:24px}

/* ---------------- כפתורי בחירה גדולים ---------------- */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;
  cursor:pointer;text-align:start}
.pick:hover{border-color:var(--ink-3)}
.pick.on{border-color:var(--ink);border-width:2px;padding:17px}
.pick.off{opacity:.42;cursor:not-allowed}
.pick .t{display:block;font-size:17px;font-weight:900;margin-top:6px;line-height:1.25}
.pick .s{display:block;font-size:13px;color:var(--ink-3);margin-top:5px;line-height:1.4}

/* ---------------- משבצות המדידה ---------------- */
.runs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.runs.two{grid-template-columns:repeat(2,1fr);max-width:430px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 12px;
  text-align:center;cursor:pointer}
.run:hover:not(.off){border-color:var(--ink-3)}
.run .n{font-family:var(--mono);font-size:19px;font-weight:700}
.run .s{font-size:12px;color:var(--ink-3);margin-top:6px;min-height:17px}
.run.on{border-color:var(--ink);border-width:2px;padding:15px 11px}
.run.done{background:#f3fbf7;border-color:#bfe8d4}
.run.done .n{color:var(--ok)}
.run.off{opacity:.38;cursor:not-allowed}
.runbar{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.runbar .lbl{font-size:13px;color:var(--ink-3)}

/* ---------------- הגרף ---------------- */
.chartwrap{position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px 10px}
/* direction:ltr בתוך ה-SVG: text-anchor נמדד לפי כיוון הבסיס, ובדף RTL
   "end" הוא הקצה השמאלי. בלי זה מספרי ציר ה-Y נעגנים הפוך ונכנסים לשטח
   הגרף. מערכת הצירים של SVG היא שמאל-לימין ממילא, אז עדיף שהעיגון יתאים לה. */
#chart{width:100%;height:204px;display:block;direction:ltr}
.chartfoot{display:flex;align-items:center;gap:16px;margin-top:4px;flex-wrap:wrap}
.chartfoot .k{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.chartfoot .k i{display:inline-block;width:14px;height:2px;margin-inline-end:5px;vertical-align:3px}
.metsel{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;
  margin-inline-start:auto}
.metsel button{border:0;border-radius:0;padding:5px 13px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.metsel button+button{border-inline-start:1px solid var(--line)}
.metsel button.on{background:var(--ink);color:#fff;font-weight:700}

/* סרגל הרעש */
#cal{position:absolute;width:52px;cursor:grab;touch-action:none;user-select:none;z-index:3}
#cal.drag{cursor:grabbing}
#cal .tip{position:absolute;top:-16px;inset-inline-start:50%;transform:translateX(50%);
  font-family:var(--mono);font-size:10px;color:var(--brand-2);white-space:nowrap}
#calsay{margin-top:10px;font-size:17px;font-weight:700;min-height:26px}
#calsay.over{color:var(--ok)} #calsay.under{color:var(--err)} #calsay.edge{color:var(--warn)}
/* מצב חסר: הלוח הזה לא יכול לעבוד בלי רעש ובלי שתי נקודות אמיתיות סמוכות.
   עדיף לומר מה חסר ואיפה משיגים אותו מאשר להשאיר שורה ריקה. */
#calsay .calneed{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);
  line-height:1.6;max-width:640px}
#calsay .calneed b{color:var(--ink)}
/* אזהרת שמירה. position:fixed, ולכן היא מחוץ לזרימה ולא משנה גובה של שום לוח. */
#savewarn{position:fixed;left:14px;top:60px;z-index:40;max-width:300px;
  background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:9px;
  padding:8px 11px;font-size:12px;line-height:1.55;font-weight:500}
#savewarn[hidden]{display:none}

/* ---------------- טבלת המספרים — נפתחת, לא מוצגת ---------------- */
.numsbtn{margin-top:8px}
#nums{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:none}
#nums.open{display:block}
#nums table{width:100%;border-collapse:collapse;direction:ltr}
#nums th,#nums td{font-family:var(--mono);font-size:13px;padding:6px 8px;text-align:center}
#nums th{color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line);font-size:11.5px}
#nums td.rl{direction:rtl;text-align:right;color:var(--ink-3);font-family:var(--font);font-size:12.5px}
#nums tr+tr td{border-top:1px solid var(--surface-2)}
#nums input{width:62px;padding:3px 0;text-align:center;font-family:var(--mono);font-size:13px;
  border-radius:5px}

/* ---------------- שונות ---------------- */
.gate{display:flex;gap:20px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.gate img{width:260px;height:190px;object-fit:cover;flex:none;display:block}
.gate .in{padding:20px 22px}
.gate ol{margin:10px 0 0;padding-inline-start:18px;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.gate code{font-family:var(--mono);font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink)}
.cells{display:flex;gap:16px;margin-top:4px}
.cellbox{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.cellbox canvas{width:132px;height:132px;border-radius:9px;display:block;margin:0 auto 9px}
.cellbox .t{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.cellbox .d{font-size:12px;color:var(--ink-3);margin-top:3px}
/* המשוב על הטענה שנבחרה. ירוק/כתום כמו בשאר הלוח, בלי "נכון/לא נכון". */
.mapsay{margin-top:11px;font-size:13.5px;line-height:1.62;color:var(--ink-2);max-width:780px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.mapsay.ok{border-color:#bfe8d4;background:#f3fbf7}
.mapsay.no{border-color:#f6ddb4;background:#fff8ec}
.mapsay b{color:var(--ink);font-weight:700}

/* ---------------- לוח 9: סגירת הניסוי ---------------- */
.recap{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:11px 16px;font-size:12.8px;line-height:1.58;color:var(--ink-2);max-width:900px}
.recap .rg{font-size:13.5px;color:var(--ink);margin-bottom:5px}
.recap b{color:var(--ink);font-weight:700}
.recap ol{margin:0;padding-inline-start:17px}
.claims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;max-width:900px}
.claim{display:flex;gap:9px;align-items:flex-start;text-align:start;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:12.8px;line-height:1.48;color:var(--ink-2)}
.claim:hover{border-color:var(--ink-3)}
.claim .bx{flex:none;width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:4px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.claim.on{background:#eefbf5;border-color:var(--ok);color:var(--ink)}
.claim.on .bx{background:var(--ok);border-color:var(--ok)}
.fields{display:grid;gap:14px;max-width:720px}
.fields label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.stamp{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ok);
  border:1px solid #bfe8d4;background:#f3fbf7;border-radius:20px;padding:4px 12px}
.stamp.broken{color:var(--warn);border-color:#f6ddb4;background:#fff8ec}
.doneBig{text-align:center;padding:30px 0}
.doneBig .big{font-size:52px;font-weight:900;font-family:var(--mono);color:var(--ok)}

/* ---------------- כותרת תחתונה ---------------- */
footer{height:70px;flex:none;display:flex;align-items:center;gap:16px;padding:0 26px;
  background:var(--surface);border-top:1px solid var(--line)}
footer .hint{font-size:13px;color:var(--ink-3);margin-inline-end:auto}
footer .hint b{color:var(--warn);font-weight:700}

/* ---------------- הזרוע ---------------- */
#arm{position:fixed;z-index:60;left:26px;bottom:88px;width:52px;height:52px}
#armbtn{width:52px;height:52px;border-radius:50%;background:var(--ink);border:0;padding:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 10px rgba(13,31,43,.18)}
#armbtn svg{width:26px;height:26px}
/* inset-inline-END ולא start: ב-RTL הצד ה"מתחיל" הוא הימני, ופאנל של 340px
   שנתלה ממנו יוצא מהמסך שמאלה. כאן הוא נתלה מהקצה השמאלי ונפתח פנימה. */
#armpanel{position:absolute;bottom:62px;inset-inline-end:0;inset-inline-start:auto;
  width:min(340px,calc(100vw - 60px));background:var(--ink);
  border-radius:14px;padding:8px;display:none}
#armpanel.open{display:block}
#armgrab{height:14px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:grab}
#armgrab i{width:18px;height:2px;background:#466;border-radius:2px;display:block}
#armscreen{background:#062028;border-radius:10px;padding:13px 15px;color:#cfe7ee;
  font-size:13.5px;line-height:1.6;max-height:260px;overflow-y:auto}
#armscreen .eyebrow{color:#568798;margin-bottom:6px}
#armscreen h4{margin:0 0 3px;font-size:13px;color:#8fd8cd;font-weight:700}
#armscreen p{margin:0 0 11px}
#armscreen .pit{color:#f0b67a}
#armtabs{display:flex;gap:4px;margin-top:7px}
#armtabs button{flex:1;border:0;background:#13323d;color:#7fa8b6;font-size:12px;padding:6px 0;
  border-radius:7px;font-weight:700}
#armtabs button.on{background:var(--accent);color:#062028}
.askrow{display:flex;gap:5px;margin-top:9px}
.askrow input{background:#0b2c37;border-color:#1d4a5c;color:#dff3f8;font-size:13px;padding:8px 10px}
.askrow button{background:var(--accent);color:#062028;border:0;padding:7px 13px;font-size:13px}

/* ---------------- לוח 1: תדריך. הצגה, לא בחירה. ---------------- */
.brief{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.bmain,.bside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.brow{display:flex;gap:12px;align-items:flex-start}
.brow+.brow{margin-top:13px;padding-top:13px;border-top:1px solid var(--surface-2)}
.bn{flex:none;width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.brow b{display:block;font-size:15px;font-weight:900;line-height:1.3}
/* "div span" ולא "span": .bn הוא span ישיר של .brow, וכלל רחב יותר היה
   צובע את המספר ב-ink-2 על רקע ink — בלתי נראה. */
.brow div span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.bq{margin:7px 0 0;font-size:20px;font-weight:900;line-height:1.3}
.ba{margin:7px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.bfact{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-top:11px;padding-top:9px;border-top:1px solid var(--surface-2)}
.bfact span{font-size:12px;color:var(--ink-3)}
.bfact b{font-size:13.5px;font-weight:700}
.bwarn{margin:13px 0 0;font-size:14px;color:var(--ink-2);line-height:1.6;
  border-inline-start:3px solid var(--accent);padding-inline-start:12px}

/* ---------------- לוח 2: הורדות ---------------- */
.dls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.dl{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:13px 10px;text-align:center;color:inherit;cursor:pointer;
  font-family:inherit;font-size:inherit;font-weight:400}
.dl:hover:not(.got){border-color:var(--ink-3)}
.dl.got{background:#f3fbf7;border-color:#bfe8d4}
.dl .n{font-family:var(--mono);font-size:19px;font-weight:700;display:block}
.dl.got .n{color:var(--ok)}
.dl .c{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:block;line-height:1.45}
.dl .mb{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;display:block}
/* העיגול: הורדה, ואחרי שהבייטים הגיעו — וי. */
.dlb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);display:flex;align-items:center;
  justify-content:center;margin:0 auto 7px}
.dl:hover .dlb{border-color:var(--ink);color:var(--ink)}
.dl.got .dlb,.dlbench.got .dlb{background:var(--ok);border-color:var(--ok);color:#fff}
.busy .dlb{border-color:var(--line-2);border-top-color:var(--accent);
  animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dlbench{display:flex;align-items:center;gap:14px;margin-top:11px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:12px;padding:12px 18px;color:inherit;
  width:100%;text-align:start;cursor:pointer;font-family:inherit;font-size:inherit;font-weight:400}
.dlbench:hover:not(.got){border-color:var(--ink-3)}
.dlbench.got{background:#f3fbf7;border-color:#bfe8d4}
.dlbench .dlb{margin:0;flex:none}
.dlbench .t{font-weight:900;font-size:15px}
.dlbench .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.inzip{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.8}
.inzip b{color:var(--ink-2);font-weight:500}

/* ---------------- לוח 3: הסברי המדדים ---------------- */
.metqrow{display:flex;align-items:center;gap:12px;margin-top:9px;flex-wrap:wrap}
.metq{display:flex;gap:7px;flex-wrap:wrap;margin-inline-start:auto}
.metq button{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;
  padding:3px 11px;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.metq button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
/* שתי עמודות: ההסבר והמשפט זה לצד זה. אחרת הלוח גולש, והמסך מפסיק להיות מסך אחד. */
.hyprow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;align-items:start}
.metbox{background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:13px 16px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.metbox b{color:var(--ink);font-weight:700}
.metbox .hd{font-size:14.5px;font-weight:900;color:var(--ink);margin-bottom:4px}
.ptsay{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.65;display:flex;
  gap:14px;align-items:center}
.ptsay b{color:var(--ink);font-weight:700}
.predcount{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

.fn{flex:none;width:21px;height:21px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);

.fstep.done .fn{background:var(--ok);color:#fff}
.fstep.now .fn{background:var(--ink);color:#fff}
.fstep .ft{font-size:14px;font-weight:900;line-height:1.25}

.fstep .fa{margin-top:10px}

.fstep .fa label,.fstep .fa a{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;

.fstep .fa label:hover,.fstep .fa a:hover{border-color:var(--ink)}
.fstep .fa a.hasdl,.fstep .fa button.hasdl{background:#f3fbf7;border-color:#bfe8d4;color:var(--ok)}

.flow.mini .fd,.flow.mini .fa{display:none}
.flow.mini .fstep{padding:9px 12px}
.fslot+.fslot{margin-top:6px}
.fslot.has label{background:#f3fbf7;border-color:#bfe8d4;color:var(--ok)}
.noiseout{margin-top:12px;background:var(--surface);border:1px solid var(--line);

.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

<script>

const PTS = [
  {n:25, acc:.610,sens:.520,spec:.700,TP:52,FN:48,FP:30,TN:70},

  {n:200,acc:.915,sens:.910,spec:.920,TP:91,FN:9, FP:8, TN:92},
  {n:400,acc:.925,sens:.920,spec:.930,TP:92,FN:8, FP:7, TN:93}
];
const NOISE_RUN = {n:100,acc:.855,sens:.840,spec:.870,TP:84,FN:16,FP:13,TN:87};
const MET = {acc:'דיוק', sens:'רגישות', spec:'ספציפיות'};
/* הניחוש מתחיל כקו ישר ב-70, והתלמיד מעצב אותו. קו ישר הוא כבר השערה -
   "לא ישתנה כלום" - ולכן עדיף להתחיל ממנו מאשר ממסך ריק. */
const FLAT = 0.70;
const flatLine = () => ({25:FLAT,50:FLAT,100:FLAT,200:FLAT,400:FLAT});
const moved = m => PTS.some(p=>Math.abs(S.predict[m][p.n]-FLAT)>0.005);
/* הרעש הוא ההפרש בין שני האימונים של התלמיד. אם עוד לא רצו — הנתון המובנה,
   כדי שאפשר יהיה לעבור על הדמו בלי לאמן. */
const noiseBand = m => (S.nres && S.nres.A && S.nres.B)
  ? Math.abs(S.nres.A[m] - S.nres.B[m])*100
  : Math.abs(PTS.find(p=>p.n===100)[m] - NOISE_RUN[m])*100;
/* הערך של נקודה: התוצאה האמיתית של התלמיד אם הוא כבר הריץ, ואחרת הנתון
   המובנה — כדי שאפשר יהיה לעבור על הדמו בלי לאמן חמישה מודלים. */
const val = (n,m) => (S.runs[n] && S.runs[n].res) ? S.runs[n].res[m] : PTS.find(p=>p.n===n)[m];
const gaps = m => PTS.slice(1).map((p,i)=>(
  {from:PTS[i].n, to:p.n, delta:(val(p.n,m)-val(PTS[i].n,m))*100}));
function plateauFrom(m){
  const g=gaps(m), nb=noiseBand(m);
  for(let i=0;i<g.length;i++) if(g.slice(i).every(x=>x.delta<=nb)) return g[i].from;
  return null;
}

  spec:{t:'ספציפיות', d:'מתוך <b>100 התמונות התקינות בלבד</b> — בכמה צדק.',
        w:'זה "כמה אזעקות שווא לא עשיתי". כל אזעקת שווא היא בדיקה מיותרת לאדם בריא.'}
};

/* רשימה אחת, משותפת לכל הגדלים. אותם צעדים בדיוק בכל אימון — זו כל הנקודה,
   ולכן אין טעם לחזור עליה חמש פעמים. הסימון עובר לקופסאות המודלים. */
const CHK = [

  '<code>Export Model</code> ← לשונית <code>Tensorflow.js</code> ← <code>Download my model</code>',
  'פתחו את ה-ZIP שירד, וגררו את התיקייה לקופסה של הגודל שאימנתם'
];

/* ========== מצב ========== */
const S = {
  i:0, stage:2, metric:'acc',
  runs:{}, sel:null,
  predict:{acc:flatLine(),sens:flatLine(),spec:flatLine()}, locked:null, broken:false,
  notes:{}, done:{}, prec:{}, cal:null, calXY:null,
  gotMB:{}, dling:{}, dlerr:'', claims:{}, metQ:null,
  models:{}, touched:{},
  nmod:{A:null,B:null}, nfiles:{A:null,B:null}, nres:{A:null,B:null},
  nbusy:'', nprog:0, nerr:'',
  rbusy:false, rprog:0, rerr:'', mdlerr:'',
  armOpen:false, armTab:'how', numsOpen:false, filed:0
};
const pred = () => S.predict[S.metric];
const step = () => STEPS[S.i];
const avail = s => s.stage <= S.stage;
const captured = () => PTS.filter(p=>S.runs[p.n] && S.runs[p.n].cap).map(p=>p.n);
const noiseIn = () => !!(S.nres.A && S.nres.B);

/* ========== כותרת ========== */
function renderSteps(){
  document.getElementById('steps').innerHTML = STEPS.map((s,i)=>
    `<button data-i="${i}" title="${s.h}"
      class="${S.done[s.id]?'done':''} ${i===S.i?'on':''} ${avail(s)?'':'lock'}"
      ${avail(s)?'':'disabled'}><b>${S.done[s.id]?'✓':(i+1)}</b></button>`).join('');
  document.getElementById('stg').textContent = S.stage;
}

/* ========== הבמה ========== */
function render(){
  const s = step();
  renderSteps();
  document.getElementById('stage').innerHTML = `
    <span class="eyebrow">${('0'+(S.i+1)).slice(-2)} / 10 · ${s.eyebrow}</span>
    <h1>${s.h}</h1>
    <p class="lede">${s.lede}</p>
    <div class="work">${work(s)}</div>`;
  footer(s);
  /* בלוח התדריך אין מה לשאול עליו — הזרוע מוסתרת שם. */
  document.getElementById('arm').style.display = s.kind==='brief' ? 'none' : '';
  if (s.kind==='brief') S.armOpen = false;
  armScreen();
  if (s.id==='maps') drawCells();
  if (document.getElementById('chart')) { drawChart(); placeCal(); }
  save();   /* כל ציור מחדש הוא שינוי מצב — ראו "שמירה מקומית" בסוף הקובץ */
}

function work(s){
  switch(s.id){
    case 'exp_marked': return wBrief();
    case 'sizes':      return wSizes();
    case 'hypothesis': return wHyp();
    case 'noise':      return wNoise();
    case 'models':     return wModels();
    case 'runs5':      return wRuns();
    case 'read3':      return wRead();
    case 'maps':       return wMaps();
    case 'conclusion': return wConc();
    case 'record':     return wRec();
  }
}

/* לוח 2 — הורדות.
   ההורדה עוברת דרך fetch ולא דרך קישור ישיר, כי רק כך אפשר לדעת שהבייטים
   באמת הגיעו ולסמן וי באמת. קישור <a download> רגיל לא מדווח דבר. */
const ICON_DL = '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5v8M6.6 8.6 10 12l3.4-3.4M4.2 15.4h11.6"/></svg>';
const ICON_OK = '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.6 10.4 3.4 3.4 7.4-7.8"/></svg>';
/* "ירד" נגזר מהגודל שנמדד ולא מדגל נפרד, כי שני דגלים מקבילים יכולים להיפרד:
   כך וי ירוק לא יכול להופיע בלי בייטים שבאמת הגיעו, וגם לא "undefined MB". */
const got = key => S.gotMB[key] !== undefined;
const badge = key => `<span class="dlb">${S.dling[key]?'':(got(key)?ICON_OK:ICON_DL)}</span>`;

async function grab(key, file, filename){
  if (S.dling[key]) return;
  S.dling[key]=true; S.dlerr=''; render();
  try{
    const r = await fetch(DATA+file);
    if (!r.ok) throw new Error('הקובץ לא נמצא בשרת (' + r.status + ')');
    const b = await r.blob();
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 10000);
    S.gotMB[key]=(b.size/1048576).toFixed(2);
  }catch(e){ S.dlerr='ההורדה נכשלה — '+e.message; }
  S.dling[key]=false; render();
}

const SIZES=[25,50,100,200,400];
const setName = n => `ערכת אימון - ${n} לכל מחלקה.zip`;

/* "?" לכל מדד. ההסבר מחליף את תיבת "נקודת הדיוק" במקום להתווסף מתחתיה,
   כך שגובה הלוח אינו משתנה כשפותחים אותו. */
function metQuestions(counts){
  const btns = Object.keys(MET).map(m=>
    `<button data-metq="${m}" class="${S.metQ===m?'on':''}">${MET[m]} ?</button>`).join('');
  return `<div class="metqrow">
      <span class="predcount">גרף נפרד לכל מדד: ${counts}</span>
      <div class="metq">${btns}</div></div>`;
}

/* "נקודה" היא יחידת המדידה של כל השבוע, ולכן היא מוסברת כאן בדוגמה מספרית
   ולא בהגדרה: שני אחוזים קונקרטיים, ההפרש ביניהם, וכמה תמונות זה. */
function ptsExplain(){
  const perImg = 100/WEEK.benchN;            /* 0.5 נקודות לתמונה */
  const HI = 88.0, LO = 85.5;                /* מקור אחד לדוגמה: גם האיור וגם הטקסט */
  const gap = +(HI-LO).toFixed(1);           /* 2.5 נקודות */
  const imgs = Math.round(gap/perImg);       /* 5 תמונות */
  /* האיור ltr מבפנים: שני המספרים משמאל, הסוגר לידם, והתווית בצדו החיצוני.
     קודם הכל היה מעוגן לפי כיוון הדף, ולכן התווית חצתה את הסוגר
     והאחוזים נחתכו מחוץ ל-viewport. */
  return `<div class="ptsay">
      <svg width="88" height="62" viewBox="0 0 88 62"
        style="flex:none;direction:ltr" aria-hidden="true">
        <text x="48" y="12" font-size="11" fill="#0d1f2b" text-anchor="end"
          font-family="JetBrains Mono,monospace">${HI.toFixed(1)}%</text>
        <text x="48" y="58" font-size="11" fill="#0d1f2b" text-anchor="end"
          font-family="JetBrains Mono,monospace">${LO.toFixed(1)}%</text>
        <line x1="58" y1="9"  x2="58" y2="55" stroke="#0e7490" stroke-width="1.6"/>
        <line x1="54" y1="9"  x2="62" y2="9"  stroke="#0e7490" stroke-width="1.6"/>
        <line x1="54" y1="55" x2="62" y2="55" stroke="#0e7490" stroke-width="1.6"/>
        <text x="66" y="36" font-size="11" fill="#0e7490" font-weight="700"
          text-anchor="start" font-family="JetBrains Mono,monospace">${gap}</text>
      </svg>
      <div><b>"נקודה" היא אחוז אחד.</b>
        מודל שקיבל ${HI.toFixed(1)}% ומודל שקיבל ${LO.toFixed(1)}% נבדלים
        ב-<b>${gap} נקודות</b> — זה כל החישוב, חיסור. ובערכת מבחן של
        ${WEEK.benchN} תמונות כל תמונה שווה
        <b class="num">${perImg.toFixed(1)}</b> נקודות, אז ${gap} נקודות הן בדיוק
        <b>${imgs} תמונות</b> שהאחד צדק בהן והשני טעה.</div></div>`;
}

/* לוח 4 — תרשים זרימה. ארבעה שלבים ממוספרים: ברור על מה לוחצים קודם,
   וברור איפה זה נגמר. ההרצה כאן אמיתית — אותה ערימה שבכלי ההערכה. */

        <div class="fd">פרויקט חדש, גררו <code>נגוע</code> ו<code>תקין</code>, Train,
          ואז Export → Tensorflow.js. ואז <b>שוב מאפס</b>, אותן תמונות.</div>

        <div class="fd">בחרו את <b>התיקייה</b> שירדה מ-TM (זו עם
          <code>model.json</code>), אחת לכל אימון.</div>

      </div>

      <div class="fstep ${st(okRun, okUp&&!okRun)}">

        <div class="fd">ערכת המבחן (${WEEK.benchN} תמונות) נטענת לכאן <b>לבד</b> — אין מה
          להעלות. שני המודלים רצים עליה בסף 0.50, וההפרש הוא הרעש.</div>
        <div class="fa">

          ${S.nbusy?`<div class="prog"><i style="width:${Math.round(S.nprog*100)}%"></i></div>

        </div>
      </div>
    </div>

    ${S.nerr?`<p style="margin-top:12px;color:var(--err);font-size:13.5px">${S.nerr}</p>`:''}
    ${okRun?noiseOut():`<p style="margin-top:14px;font-size:12.5px;color:var(--ink-3)">

}

/* טבלה אחת ולא שני בלוקים: שורת ההפרש היא התוצר, וצריך לראות אותה
   מתחת לשני המספרים שהיא נגזרת מהם. */
function noiseOut(){
  const A=S.nres.A, B=S.nres.B, m=S.metric;
  const f=(r,k)=>(r[k]*100).toFixed(1);
  const d=k=>Math.abs(A[k]-B[k])*100;
  const row=(ttl,r,cls)=>`<tr class="${cls||''}"><td class="rl">${ttl}</td>
      <td>${f(r,'acc')}</td><td>${f(r,'sens')}</td><td>${f(r,'spec')}</td>
      <td>${r.TP} / ${r.FP}</td></tr>`;
  return `<div class="noiseout">
      <table class="notab">
        <tr><th></th><th>דיוק</th><th>רגישות</th><th>ספציפיות</th><th>TP / FP</th></tr>
        ${row('אימון א׳',A)}${row('אימון ב׳',B)}
        <tr class="dif"><td class="rl">ההפרש</td>
          <td>${d('acc').toFixed(1)}</td><td>${d('sens').toFixed(1)}</td>

/* לוח 5 — צ׳ק ליסט נפרד לכל גודל. אותם שישה צעדים בכל עמודה: מה שנשאר
   זהה בין המודלים הוא מה שהופך את ההשוואה ביניהם לתקפה. */
function wModels(){
  const boxes = SIZES.map(n=>{
    const open = n===25 || S.stage>=2, m = S.models[n];
    if (!open) return `<div class="mbox off"><div class="mpad">
        <span class="mic">·</span><span class="mn">${n}</span><span class="ms">שלב 2</span></div></div>`;
    return `<div class="mbox ${m?'full':''}">
        <label class="mpad">
          <input type="file" webkitdirectory directory multiple data-model="m${n}">
          <span class="mic">${m?ICON_OK:'+'}</span>
          <span class="mn">${n}</span>
          <span class="ms" title="${m?m.name:''}">${m?m.name:'גררו לכאן את המודל'}</span>
        </label></div>`;
  }).join('');
  return `<div class="sharedchk">
      <ol>${CHK.map(t=>`<li>${t}</li>`).join('')}</ol>
      <button id="openTM">פתיחת Teachable Machine</button>

    ${S.mdlerr?`<p style="margin-top:9px;color:var(--err);font-size:13px">${S.mdlerr}</p>`:''}`;
}

/* לוח 6 — המודלים כבר שמורים בלוח 5, אז אין כאן טעינה: רק בחירה והרצה.
   הגרף מוצג מההתחלה עם קו הניחוש בלבד, וכל הרצה מוסיפה לו נקודה אמיתית. */
function wRuns(){
  const sel = S.sel;
  const boxes = SIZES.map(n=>{
    const open = n===25||S.stage>=2, m = S.models[n], st = S.runs[n]||{};
    const can = open && !!m;
    const txt = !open ? 'שלב 2' : (st.cap ? 'על הגרף' : (m ? 'מוכן להרצה' : 'אין מודל'));
    return `<button class="run ${st.cap?'done':''} ${sel===n?'on':''} ${can?'':'off'}"
      data-run="${n}" ${can&&!st.cap?'':'disabled'}>
      <span class="n">${n}</span><span class="s">${txt}</span></button>`;
  }).join('');
  const ready = sel && S.models[sel] && !(S.runs[sel]||{}).cap;
  return `<div class="runs">${boxes}</div>
    <div class="runbar">
      <button class="go" id="runReal" ${ready&&!S.rbusy?'':'disabled'}>${
        S.rbusy ? 'רץ…' : (sel ? `הרצת המודל של ${sel}` : 'בחרו גודל')}</button>

        Math.round(S.rprog*100)}%"></i></div>`:''}
    </div>
    ${S.rerr?`<p style="color:var(--err);font-size:13px;margin-top:8px">${S.rerr}</p>`:''}

    ${captured().length<5?`<p style="margin-top:7px;font-size:12px;color:var(--ink-3)">
      אין עדיין מודלים?
      <button class="quiet" id="demoRuns" style="font-size:12px;padding:2px 8px">מילוי בנתוני דמו</button></p>`:''}`;
}

async function runReal(n){
  S.rbusy=true; S.rprog=0; S.rerr=''; render();
  try{
    await loadTM();
    const imgs = await benchList();
    const model = await modelFromFiles(S.models[n].files);
    const res = await evalModel(model, imgs, p=>{ S.rprog=p;
      const el=document.querySelector('.prog i'); if(el) el.style.width=Math.round(p*100)+'%'; });
    S.runs[n] = {res, cap:true};
    if (captured().length>=5) S.done.runs5=true;
  }catch(e){ S.rerr='ההרצה נכשלה — '+e.message; }
  S.rbusy=false; S.sel=null; render();
}

/* ה-viewBox נקבע מחדש בכל ציור לפי הגודל האמיתי, כך שיחידה אחת ב-SVG שווה
   פיקסל CSS אחד. קודם היה viewBox קבוע עם preserveAspectRatio="none", ולכן
   כל טקסט נמתח לרוחב — זו הסיבה שמספרי ציר ה-Y נראו פחוסים. */
let CX={x0:46,x1:600,y0:14,y1:174};
function layout(el){
  const r = el.getBoundingClientRect();
  const W = Math.max(320, Math.round(r.width)), H = Math.max(120, Math.round(r.height));
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  /* מקום לכותרת הציר האנכי למעלה, ולמספרים ולכותרת הציר האופקי למטה. */
  CX = {x0:52, x1:W-18, y0:22, y1:H-42};
}
const px = i => CX.x0 + i*(CX.x1-CX.x0)/4;
const py = v => CX.y1 - (v-.5)/.5*(CX.y1-CX.y0);
function drawChart(){
  const el = document.getElementById('chart'); if(!el) return;
  layout(el);
  const m = S.metric; let s='';
  for(let v=.5;v<=1.001;v+=.1){
    s+=`<line x1="${CX.x0}" y1="${py(v)}" x2="${CX.x1}" y2="${py(v)}" stroke="#eef3f7"/>
        <text x="${CX.x0-9}" y="${py(v)+4}" font-size="11" fill="#8aa2b3" text-anchor="end"
          font-family="JetBrains Mono,monospace">${Math.round(v*100)}%</text>`;
  }
  PTS.forEach((p,i)=> s+=`<text x="${px(i)}" y="${CX.y1+20}" font-size="12" fill="#8aa2b3"
    text-anchor="middle" font-family="JetBrains Mono,monospace">${p.n}</text>`);
  /* משמעות הצירים — בלי זה המספרים 25..400 ו-50..100 הם סתם מספרים.
     ה-SVG כולו ltr (ראו את הכלל של #chart), ולכן "end" הוא הקצה הימני:
     הכותרת נתלית מ-x1 וגדלה שמאלה. הטקסט עצמו עברי ונקרא כרגיל. */
  s+=`<text x="${CX.x1}" y="${CX.y0-9}" font-size="11" fill="#4a6478" text-anchor="end"
        font-family="Heebo,sans-serif" font-weight="700">${MET[m]} — אחוז מתוך ערכת המבחן</text>
      <text x="${(CX.x0+CX.x1)/2}" y="${CX.y1+37}" font-size="11.5" fill="#4a6478"
        text-anchor="middle" font-family="Heebo,sans-serif" font-weight="700">תמונות אימון לכל מחלקה</text>`;

  const P = pred();
  const pr = PTS.map((p,i)=> P[p.n]==null?null:[px(i),py(P[p.n])]);
  if (pr.every(Boolean))
    s+=`<polyline points="${pr.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#0891b2"
        stroke-width="2" stroke-dasharray="6 4" opacity=".65"/>`;
  pr.forEach(q=>{ if(q) s+=`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="#fff" stroke="#0891b2"
      stroke-width="2.2" opacity=".85"/>`; });

  const caps = captured();
  if (noiseIn()){
    const h=(CX.y1-CX.y0)*(noiseBand(m)/100)/.5;
    caps.forEach(n=>{ const i=PTS.findIndex(p=>p.n===n);
      s+=`<rect x="${px(i)-14}" y="${py(val(n,m))-h/2}" width="28" height="${h}"
        fill="#cbd9e2" opacity=".6" rx="3"/>`; });
  }
  const dots = PTS.map((p,i)=> caps.includes(p.n)?[px(i),py(val(p.n,m))]:null).filter(Boolean);
  if (dots.length>1) s+=`<polyline points="${dots.map(q=>q.join(',')).join(' ')}" fill="none"
      stroke="#0d1f2b" stroke-width="2.6"/>`;
  dots.forEach(q=> s+=`<circle cx="${q[0]}" cy="${q[1]}" r="5.5" fill="#0d1f2b"/>`);

  if (step().id==='read3' && S.cal!=null){
    const i=S.cal, g=gaps(m)[i], h=(CX.y1-CX.y0)*(noiseBand(m)/100)/.5;
    const xm=(px(i)+px(i+1))/2, ym=(py(val(PTS[i].n,m))+py(val(PTS[i+1].n,m)))/2;
    const dh=(CX.y1-CX.y0)*(g.delta/100)/.5;
    s+=`<line x1="${xm}" y1="${ym-dh/2}" x2="${xm}" y2="${ym+dh/2}" stroke="#0d1f2b" stroke-width="2.6"/>
        <line x1="${xm-17}" y1="${ym-h/2}" x2="${xm+17}" y2="${ym-h/2}" stroke="#0e7490" stroke-width="3"/>
        <line x1="${xm-17}" y1="${ym+h/2}" x2="${xm+17}" y2="${ym+h/2}" stroke="#0e7490" stroke-width="3"/>
        <line x1="${xm}" y1="${ym-h/2}" x2="${xm}" y2="${ym+h/2}" stroke="#0e7490" stroke-width="1.2"
          stroke-dasharray="3 3"/>`;
  }
  if (step().id==='read3'){
    gaps(m).forEach((g,i)=>{ if(!(caps.includes(g.from)&&caps.includes(g.to))) return;
      s+=`<rect data-gap="${i}" x="${px(i)}" y="${CX.y0}" width="${px(i+1)-px(i)}"
        height="${CX.y1-CX.y0}" fill="transparent"/>`; });
  }
  el.innerHTML = s;
}
function calState(){
  const m=S.metric, g=gaps(m)[S.cal], r=g.delta/noiseBand(m);
  if (r>1.2) return {cls:'over', t:'גדול מהרעש — הפער אמיתי'};
  if (r>=.8) return {cls:'edge', t:'על גבול הרעש'};
  return {cls:'under', t:'קטן מהרעש — המדידה לא הכריעה'};
}
/* קודם הייתה כאן שורה ריקה כשחסר רעש, והתלמיד ראה גרף, טקסט על "לסתות"
   ושום כלי על המסך. כל מצב חסר אומר עכשיו מה חסר ולאן לחזור. */
const IDX = id => STEPS.findIndex(s=>s.id===id);
const goBtn = (id,txt) => `<button class="quiet" data-goto="${IDX(id)}"
  style="font-size:12.5px;padding:2px 9px;margin-inline-start:4px">${txt}</button>`;
function calSay(){
  if (!noiseIn()) return `<span class="calneed"><b>אין עדיין סרגל.</b>
    אורך הסרגל הוא הרעש שלכם, ועוד לא מדדתם אותו: בלוח 4 מאמנים פעמיים
    על אותה ערכה, וההפרש בין שני האימונים הוא האורך הזה.
    ${goBtn('noise','מעבר ללוח 4')}</span>`;
  const caps = captured();
  if (!gaps(S.metric).some(g=>caps.includes(g.from)&&caps.includes(g.to)))

      קפיצה היא המרחק בין שתי נקודות <b>סמוכות</b> שהרצתם באמת — כרגע
      יש ${caps.length} ${caps.length===1?'נקודה אמיתית':'נקודות אמיתיות'}.

/* המיקום נשמר בין פתיחות, ולכן אסור שאפשר יהיה לגרור את הסרגל אל מחוץ
   לכרטיס ולאבד אותו לתמיד. כל מיקום — נגרר או משוחזר — נכלא בתוך הכרטיס. */
function clampCal(p, hgt){
  const w=document.querySelector('.chartwrap'); if(!w) return p;
  const r=w.getBoundingClientRect();
  const maxX=Math.max(0, r.width-52), maxY=Math.max(16, r.height-hgt);
  return {x:Math.min(Math.max(p.x,0),maxX), y:Math.min(Math.max(p.y,16),maxY)};
}
function placeCal(){
  const c=document.getElementById('cal'); if(!c) return;
  const svg=document.getElementById('chart').getBoundingClientRect();
  const wrap=document.querySelector('.chartwrap').getBoundingClientRect();
  const h=Math.max(14,(CX.y1-CX.y0)*(noiseBand(S.metric)/100)/.5);
  /* מתחילים בתוך שטח הגרף ולא על שוליו: ב-x=14 התווית של הסרגל נחתה
     בדיוק על מספרי ציר ה-Y. CX.x0 הוא הקצה השמאלי של אזור הציור. */
  if (!S.calXY) S.calXY={x:svg.left-wrap.left+CX.x0+10, y:svg.top-wrap.top+svg.height*0.52};
  S.calXY = clampCal(S.calXY, h+18);
  c.style.left=S.calXY.x+'px'; c.style.top=S.calXY.y+'px'; c.style.height=(h+18)+'px';
  c.innerHTML=`<span class="tip">סרגל הרעש · ${noiseBand(S.metric).toFixed(1)}</span>
    <svg width="52" height="${h+18}" style="overflow:visible">
      <line x1="26" y1="9" x2="26" y2="${h+9}" stroke="#0e7490" stroke-width="1.4" stroke-dasharray="3 3"/>
      <line x1="6" y1="9" x2="46" y2="9" stroke="#0e7490" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="6" y1="${h+9}" x2="46" y2="${h+9}" stroke="#0e7490" stroke-width="3.4" stroke-linecap="round"/>
    </svg>`;
}
function numsTable(){
  const caps=captured();
  const head=`<tr><th></th>${caps.map(n=>`<th>n=${n}</th>`).join('')}${noiseIn()?'<th>רעש</th>':''}</tr>`;
  const obj = n => (S.runs[n] && S.runs[n].res) ? S.runs[n].res : PTS.find(p=>p.n===n);

  return `<table>${head}

/* מפות קשב מזויפות אך עקביות */
function drawCells(){
  [['m25',.25,'07'],['m400',.9,'07']].forEach(([id,focus,n])=>{
    const c=document.getElementById(id); if(!c) return;
    const W=c.width, M=W/2, R=W*0.413, B=W*0.147;   /* נגזר מהקנבס, לא קבוע */
    const g=c.getContext('2d'); const im=new Image();
    im.onload=()=>{ g.drawImage(im,0,0,W,W);
      const k = focus>.5?9:34;
      for(let i=0;i<k;i++){
        const a=i*2.399, r=(1-focus)*R*Math.sqrt(i/k);
        const x=M+Math.cos(a)*r, y=M+Math.sin(a)*r;
        const rg=g.createRadialGradient(x,y,0,x,y,B);
        rg.addColorStop(0,'rgba(20,184,166,.42)'); rg.addColorStop(1,'rgba(20,184,166,0)');
        g.fillStyle=rg; g.fillRect(x-B,y-B,B*2,B*2);
      }};
    im.src='../../features/samples/נגוע/'+n+'.png';
  });
}

/* ========== כותרת תחתונה ========== */
function canAdvance(){
  const s=step();
  if (s.kind==='brief') return true;          /* תדריך — אין מה להצהיר */
  if (s.kind==='auto') return s.id==='noise' ? noiseIn() : captured().length>=5;
  if (s.id==='sizes')      return SETS.some(x=>got(x.n)) && got('bench');
  if (s.id==='models')     return SIZES.some(n=>S.models[n]);
  if (s.id==='hypothesis') return !!S.locked;
  if (s.id==='maps')       return !!S.notes.mapclaim && (S.notes.maps||'').trim().length>=12;
  if (s.id==='conclusion') return !!S.notes.verdict && claimsOn().length>0
                               && (S.notes.conclusion||'').trim().length>=12;
  if (s.id==='record')     return true;
  return (S.notes[s.id]||'').trim().length>=12;
}
function footer(s){
  const ok = canAdvance();
  document.getElementById('prev').disabled = S.i===0;
  const nx = document.getElementById('next');
  nx.disabled = !ok && s.id!=='record';
  /* ב-RTL הכיוון "קדימה" הוא שמאלה. */
  nx.textContent = S.i===STEPS.length-1 ? 'סיום' : '← הבא';
  const hints = {
    exp_marked:'קראו את שלושת השלבים',
    sizes:'הורידו לפחות ערכה אחת — ואת ערכת המבחן',
    hypothesis:`עצבו את הקו של ${MET[S.metric]}, ואז נעלו משפט עם מספר`,
    noise:'הורדה ← אימון פעמיים ← העלאה ← הרצה',
    models:'העלו לפחות מודל אחד לקופסה של הגודל שלו',
    runs5:'בחרו גודל שיש לו מודל, ואז הרצה',
    /* הרמז מתאר את מה ש-canAdvance באמת בודק — כאן זה המשפט, לא הסרגל. */
    read3: noiseIn() ? 'מדדו פער עם הסרגל, ואז כתבו את המשפט'
                     : 'אין עדיין רעש — חזרו ללוח 4 והריצו שני אימונים',
    maps: S.notes.mapclaim ? 'ועכשיו הציעו דרך לבדוק מה גורם למיקוד'
                           : 'בחרו איזו טענה המפות מחזקות',
    conclusion: !S.notes.verdict ? 'מה קרה להשערה שנעלתם?'
              : !claimsOn().length ? 'סמנו לפחות טענה אחת שאתם מסכימים איתה'
              : 'כתבו מגבלה אחת של הניסוי',
    record:'כפתור אחד'
  };
  document.getElementById('hint').innerHTML = ok
    ? '<b style="color:var(--ok)">מוכן להמשיך</b>' : hints[s.id];
}

/* ========== הזרוע ========== */
function armScreen(){
  const s=step(), el=document.getElementById('armscreen');
  const T={how:['איך עושים',s.how],why:['למה זה חשוב',s.why],trap:['המלכודת',s.trap]};

      <p id="askOut">שאלה אחת, על מה שעל המסך.</p>

        <button id="askGo">שאל</button></div>`;
  } else {

    el.innerHTML = `<span class="eyebrow">STEP ${S.i+1}</span>

  }

    b.classList.toggle('on', b.dataset.t===S.armTab));

const CANNED='כי סרגל הרעש שלכם הוא 2.5 נקודות — שני אימונים על אותן תמונות בדיוק נבדלים ביותר מזה. הפרש של 1.0 קטן מהרעש, ולכן אי אפשר להבחין בינו לבין מקריות. נסו להחליף את המדד לספציפיות ולראות מה קורה לתשובה.';

/* ========== הרצה אמיתית ==========
   אותה ערימה בדיוק שבכלי ההערכה — tfjs 1.3.1 + @teachablemachine/image 0.8 —
   כדי שמספר שיוצא כאן יהיה אותו מספר שיוצא שם. נטענת רק בלחיצה, כך שהמעבדה
   לא סוחבת מגה־בייט בכל פתיחה. */
let tmLib = null;
function loadTM(){
  if (tmLib) return tmLib;
  const add = src => new Promise((ok,bad)=>{
    const s=document.createElement('script'); s.src=src; s.onload=ok;
    s.onerror=()=>bad(new Error('טעינת הספרייה נכשלה — צריך חיבור לאינטרנט'));
    document.head.appendChild(s); });
  tmLib = add('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js')
    .then(()=>add('https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js'));
  return tmLib;
}
let benchCache = null;
async function benchList(){
  if (benchCache) return benchCache;
  const r = await fetch(DATA+'manifest.json');
  if (!r.ok) throw new Error('data/manifest.json לא נמצא — הריצו את בניית הנתונים');
  const f = (await r.json()).benchFlat;
  if (!f) throw new Error('ערכת המבחן לא נבנתה');
  benchCache = [...f.pos.map(n=>({src:DATA+'bench/pos/'+n, truth:1})),
                ...f.neg.map(n=>({src:DATA+'bench/neg/'+n, truth:0}))];
  return benchCache;
}
const loadImg = src => new Promise((ok,bad)=>{
  const i=new Image(); i.onload=()=>ok(i);
  i.onerror=()=>bad(new Error('תמונה לא נטענה: '+src)); i.src=src; });

async function modelFromFiles(files){
  const f=[...files], pick=re=>f.find(x=>re.test(x.name));
  const mj=pick(/^model\.json$/i), md=pick(/^metadata\.json$/i), wt=pick(/\.bin$/i);
  if (!mj||!md||!wt) throw new Error(
    'בתיקייה חייבים להיות model.json, metadata.json וקובץ weights.bin — בחרו את התיקייה שירדה מ-Teachable Machine');
  return tmImage.loadFromFiles(mj, wt, md);
}
/* איזה פלט הוא "נגוע". סדר הקלאסים ב-TM הוא סדר הגרירה ויכול להתהפך בין
   אימונים, והתוויות עשויות להיות באנגלית אם המאגר לא עבר לעברית — ולכן
   מזהים לפי שם, לפי אותם כללים שבכלי הפרויקט. אם אי אפשר להכריע, נופלים
   בקול ולא מנחשים: ניחוש כאן הופך רגישות לספציפיות בלי שאיש ישים לב. */
const POS_RE=/נגוע|parasit|pneumon|positive|חול/i;
const NEG_RE=/תקין|uninfect|normal|negative|בריא/i;
function posIndex(labels){
  let i = labels.findIndex(l=>POS_RE.test(l));
  if (i>=0) return i;
  i = labels.findIndex(l=>NEG_RE.test(l));
  if (i>=0 && labels.length===2) return 1-i;
  return -1;
}
async function evalModel(model, imgs, onProg){
  let TP=0,FN=0,FP=0,TN=0, idx=-1;
  for (let i=0;i<imgs.length;i++){
    const p = await model.predict(await loadImg(imgs[i].src));
    if (idx<0){
      idx = posIndex(p.map(x=>x.className));
      if (idx<0) throw new Error('אי אפשר לזהות איזו מחלקה היא "נגוע" מתוך: '
        + p.map(x=>x.className).join(' · ') + ' — שנו את שמות הקלאסים ב-TM ל"נגוע" ו"תקין"');
    }
    const yes = p[idx].probability>=0.5;
    if (imgs[i].truth===1) yes?TP++:FN++; else yes?FP++:TN++;
    if (i%5===0){ onProg((i+1)/imgs.length); await new Promise(r=>setTimeout(r)); }
  }
  const n=imgs.length;
  return {TP,FN,FP,TN, acc:(TP+TN)/n, sens:TP/((TP+FN)||1), spec:TN/((TN+FP)||1)};
}
async function runBothModels(){
  S.nerr=''; S.nprog=0;
  /* אחרי שחזור ללא הקבצים — לומר את זה ולא ליפול בתוך tfjs. */
  if (!S.nfiles.A || !S.nfiles.B){
    S.nerr='תיקיות האימון אינן זמינות בדפדפן הזה — העלו אותן שוב בשלב 3'; render(); return; }
  try{
    S.nbusy='טוען ספריות…'; render();
    await loadTM();
    S.nbusy='טוען את ערכת המבחן…'; render();
    const imgs = await benchList();
    for (const k of ['A','B']){
      const he = k==='A'?'א׳':'ב׳';
      S.nbusy=`טוען מודל ${he}…`; S.nprog=0; render();
      const model = await modelFromFiles(S.nfiles[k]);
      S.nbusy=`מריץ אימון ${he} · ${imgs.length} תמונות`; render();
      S.nres[k] = await evalModel(model, imgs, p=>{ S.nprog=p;
        const el=document.querySelector('.prog i'); if(el) el.style.width=Math.round(p*100)+'%'; });
    }
    S.nbusy=''; S.done.noise=true; render();
  }catch(err){ S.nbusy=''; S.nerr='ההרצה נכשלה — '+err.message; render(); }
}

/* ========== חיווט, בהאצלה אחת ========== */
function go(d){
  let j=S.i+d;
  while (j>=0 && j<STEPS.length && !avail(STEPS[j])) j+=d;
  if (j<0||j>=STEPS.length) return;
  if (d>0 && canAdvance()) S.done[step().id]=true;
  S.i=j; S.sel=null; render();
}
document.addEventListener('click', e=>{
  const T=s=>e.target.closest(s); let el;
  if ((el=T('#steps button'))){ S.i=+el.dataset.i; S.sel=null; render(); return; }
  if ((el=T('[data-goto]'))){ const j=+el.dataset.goto;
    if (STEPS[j] && avail(STEPS[j])){ S.i=j; S.sel=null; render(); } return; }
  if (T('#next')){ go(1); return; }
  if (T('#prev')){ go(-1); return; }
  if (T('#stgBtn')){ S.stage=S.stage===2?1:2; if(!avail(step())) S.i=0; render(); return; }
  if (T('#armbtn')){ S.armOpen=!S.armOpen; armScreen(); return; }
  if ((el=T('#armtabs button'))){ S.armTab=el.dataset.t; armScreen();
    if (S.armTab==='ask') setTimeout(()=>{
      const g=document.getElementById('askGo'); if(!g) return;
      g.onclick=()=>{ const o=document.getElementById('askOut'); o.textContent=''; let i=0;
        const t=setInterval(()=>{o.textContent=CANNED.slice(0,i+=2); if(i>=CANNED.length)clearInterval(t);},11); };
    },0); return; }
  if ((el=T('[data-dl]'))){ const k=el.dataset.dl;
    if (k==='bench') grab('bench', BENCH_SET.file, benchName());
    else { const s=SETS.find(x=>x.n===+k); if (s) grab(s.n, s.file, setName(s.n)); }
    return; }
  if ((el=T('[data-metq]'))){ S.metQ = S.metQ===el.dataset.metq?null:el.dataset.metq;
    render(); return; }
  if (T('#runBoth')){ runBothModels(); return; }
  if (T('#runReal')){ if (S.sel && S.models[S.sel]) runReal(S.sel); return; }
  if (T('#demoRuns')){ SIZES.forEach(n=>{ if(n===25||S.stage>=2)
      S.runs[n]={res:PTS.find(p=>p.n===n), cap:true}; });
    if (captured().length>=5) S.done.runs5=true; S.sel=null; render(); return; }
  if (T('#demoNoise')){
    S.nres.A=Object.assign({},PTS.find(p=>p.n===100));
    S.nres.B=Object.assign({},NOISE_RUN);
    S.nmod.A='דמו'; S.nmod.B='דמו'; S.done.noise=true; render(); return; }
  if ((el=T('[data-met]'))){ S.metric=el.dataset.met; render(); return; }
  if ((el=T('[data-verdict]'))){ S.notes.verdict=el.dataset.verdict; render(); return; }
  if ((el=T('[data-mapclaim]'))){ S.notes.mapclaim=el.dataset.mapclaim; render(); return; }
  if ((el=T('[data-claim]'))){ const k=el.dataset.claim;
    S.claims[k]=!S.claims[k]; render(); return; }
  if ((el=T('[data-run]'))){ S.sel=+el.dataset.run; render(); return; }
  if (T('#lock')){ const d=new Date();
    S.locked=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); render(); return; }
  if (T('#unlock')){ S.broken=true; S.locked=null; render(); return; }
  if (T('#numsBtn')){ S.numsOpen=!S.numsOpen; render(); return; }
  if (T('#openTM')){ window.open('https://teachablemachine.withgoogle.com/train/image','_blank','noopener,noreferrer'); return; }
  if (T('#fileAll')){ S.filed=4; S.done.record=true; render(); return; }
});
/* בחירת תיקיית מודל. שומרים את ה-FileList עצמו; הטעינה קורית רק בהרצה.
   הבדיקה נעשית כאן ולא בהרצה: עדיף לומר "זו לא תיקיית TM" ברגע הבחירה
   מאשר אחרי שלוש דקות של טעינת ספריות. */
document.addEventListener('change', e=>{
  const t=e.target;
  if (!t.dataset || t.dataset.model==null || !t.files || !t.files.length) return;
  const k=t.dataset.model, f=[...t.files];
  const has=re=>f.some(x=>re.test(x.name));
  if (!(has(/^model\.json$/i) && has(/^metadata\.json$/i) && has(/\.bin$/i))){
    S.mdlerr='התיקייה שנבחרה אינה ייצוא של Teachable Machine — חסרים model.json, metadata.json או weights.bin';
    S.nerr=S.mdlerr; render(); return;
  }
  const name = (f[0].webkitRelativePath||'').split('/')[0] || `${f.length} קבצים`;
  S.mdlerr=''; S.nerr='';
  if (k==='A'||k==='B'){ S.nfiles[k]=f; S.nmod[k]=name; S.nres[k]=null; }
  else { S.models[+k.slice(1)] = {name, files:f}; }
  render();
});
document.addEventListener('input', e=>{
  const t=e.target;
  /* הקלדה אינה מציירת מחדש, ולכן save נקרא כאן במפורש — אחרי העדכון. */
  if (t.dataset.note!=null){ S.notes[t.dataset.note]=t.value; save(); footer(step());
    if (t.dataset.note==='hypothesis'){
      const b=document.getElementById('lock');
      if (b) b.disabled = !(/\d/.test(t.value)&&t.value.length>=15&&moved(S.metric)); } return; }
  if (t.dataset.prec!=null){ const n=+t.dataset.prec, p=PTS.find(x=>x.n===n);
    const truth=100*p.TP/(p.TP+p.FP);
    S.prec[n]=t.value===''?null:parseFloat(t.value); save();
    t.style.color = S.prec[n]==null?'var(--ink-3)'
      :(Math.abs(S.prec[n]-truth)<=0.1?'var(--ok)':'var(--err)'); }
});

/* גרירת נקודות הניבוי */
document.addEventListener('pointerdown', e=>{
  const svg = e.target.closest('#chart');
  if (!svg || svg.dataset.edit!=='1' || S.locked) return;
  const r=svg.getBoundingClientRect();
  /* יחידת ה-viewBox שווה כעת לפיקסל CSS, ולכן אין צורך בשום המרה. */
  const rx=e.clientX-r.left;
  let best=0,bd=1e9;
  for(let i=0;i<5;i++){ const d=Math.abs(px(i)-rx); if(d<bd){bd=d;best=i;} }
  if (bd>54) return;
  const n=PTS[best].n, M=S.metric;
  const mv=ev=>{ const yy=ev.clientY-r.top;
    S.predict[M][n]=Math.max(.5,Math.min(1,.5+(CX.y1-yy)/(CX.y1-CX.y0)*.5)); drawChart(); };
  /* render מלא ולא footer בלבד: מונה הנקודות לכל מדד ומצב כפתור הנעילה
     משתנים עם כל נקודה שנגררה. */
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    render();};
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); mv(e);
});

/* גרירת הסרגל */
document.addEventListener('pointerdown', e=>{
  const c=e.target.closest('#cal'); if(!c) return;
  const d={dx:e.clientX-S.calXY.x, dy:e.clientY-S.calXY.y};
  c.classList.add('drag'); c.setPointerCapture(e.pointerId);
  const mv=ev=>{ S.calXY=clampCal({x:ev.clientX-d.dx, y:ev.clientY-d.dy}, c.offsetHeight);
    c.style.left=S.calXY.x+'px'; c.style.top=S.calXY.y+'px'; };
  const up=ev=>{ c.classList.remove('drag');
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    const svg=document.getElementById('chart').getBoundingClientRect();
    const rel=ev.clientX-svg.left; const caps=captured();
    S.cal=null;
    for(let i=0;i<4;i++){ const g=gaps(S.metric)[i];
      if (rel>=px(i)&&rel<=px(i+1)&&caps.includes(g.from)&&caps.includes(g.to)){ S.cal=i; break; } }
    drawChart();
    const say=document.getElementById('calsay');
    say.className=S.cal==null?'':calState().cls; say.innerHTML=calSay();
    footer(step()); save(); };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
});

/* גרירת הזרוע */
(function(){
  const arm=document.getElementById('arm');
  document.addEventListener('pointerdown', e=>{
    if (!e.target.closest('#armgrab')) return;
    const r=arm.getBoundingClientRect(); const d={dx:e.clientX-r.left, dy:e.clientY-r.top};
    const mv=ev=>{ arm.style.left=Math.max(8,Math.min(innerWidth-70,ev.clientX-d.dx))+'px';
      arm.style.top=Math.max(70,Math.min(innerHeight-70,ev.clientY-d.dy))+'px';
      arm.style.bottom='auto'; };
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  });
})();
window.addEventListener('keydown', e=>{
  if (e.key==='Escape'){ S.armOpen=false; armScreen(); }
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='ArrowLeft') go(1);
  if (e.key==='ArrowRight') go(-1);
});
window.addEventListener('resize',()=>{ if(document.getElementById('chart')){drawChart();} });

/* ========== שמירה מקומית ==========
   הדרישה: תלמיד שהתנתק ונכנס שוב לפני ההגשה לא מאבד דבר.
   IndexedDB ולא localStorage, כי תיקיות המודלים הן אובייקטי File של
   מגה-בייטים — localStorage מחזיק מחרוזות בלבד ותקוע על ~5MB.
   שתי רשומות ולא אחת: המצב הקטן נשמר בכל שינוי, והקבצים הכבדים רק כשהם
   מתחלפים — כך ששמירה שנכשלת על הקבצים אינה לוקחת איתה את התשובות. */
const DB='lab-ml', STORE='state', KEY_S='state', KEY_F='files', SNAP_V=1;
const CAN_SAVE = (()=>{ try{ return !!window.indexedDB; }catch(e){ return false; } })();

/* רשימת היתר ולא רשימת איסור: שדה חדש אינו נשמר עד שמוסיפים אותו כאן,
   וכך דגל רגעי כמו "רץ עכשיו" לא יכול לשרוד לפתיחה הבאה ולנעול כפתור. */
const SAVE_KEYS = ['i','stage','metric','predict','locked','broken','notes','done',
  'prec','cal','calXY','gotMB','claims','metQ','numsOpen','armTab','filed','nmod','nres','runs'];
const FILE_KEYS = ['models','nfiles'];

let dbp=null;
function dbOpen(){
  if (dbp) return dbp;
  dbp = new Promise((ok,bad)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = ()=>{ const d=r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
    r.onsuccess = ()=>ok(r.result);
    r.onerror   = ()=>bad(r.error||new Error('indexedDB'));
    r.onblocked = ()=>bad(new Error('הלשונית הקודמת עדיין פתוחה'));
  });
  return dbp;
}
const dbGet = key => dbOpen().then(d=>new Promise((ok,bad)=>{
  const q = d.transaction(STORE,'readonly').objectStore(STORE).get(key);
  q.onsuccess=()=>ok(q.result); q.onerror=()=>bad(q.error); }));
const dbPut = (key,val) => dbOpen().then(d=>new Promise((ok,bad)=>{
  const t = d.transaction(STORE,'readwrite');
  t.objectStore(STORE).put(val,key);
  t.oncomplete=()=>ok(true);
  t.onerror=t.onabort=()=>bad(t.error||new Error('אין מקום פנוי')); }));
const dbDel = key => dbOpen().then(d=>new Promise(ok=>{
  const t = d.transaction(STORE,'readwrite'); t.objectStore(STORE).delete(key);
  t.oncomplete=()=>ok(true); t.onerror=t.onabort=()=>ok(false); }));

function warn(msg){
  const el=document.getElementById('savewarn'); if(!el) return;
  el.textContent=msg||''; el.hidden=!msg;
}
/* חתימה זולה על הקבצים, כדי לא לכתוב 16MB בכל הקלדה. */
const sigOf = () => JSON.stringify([
  Object.keys(S.models).sort().map(n=>[n,((S.models[n]||{}).files||[]).map(f=>f.name+':'+f.size)]),
  ['A','B'].map(k=>(S.nfiles[k]||[]).map(f=>f.name+':'+f.size))]);

let saveT=null, lastSig=null, saving=false, again=false, myT=0, stopped=false;
function save(){ if(!CAN_SAVE||stopped) return; clearTimeout(saveT); saveT=setTimeout(flush,300); }
async function flush(){
  if (!CAN_SAVE || stopped) return;
  if (saving){ again=true; return; }   /* לא שתי כתיבות במקביל על אותה רשומה */
  saving=true;
  try{
    /* שתי לשוניות על אותה מעבדה: "מי שכתב אחרון מנצח" הוא בדיוק הדרך
       לאבד עבודה. אם מישהו כתב אחרינו — לא דורסים אותו, עוצרים ואומרים. */
    const cur = await dbGet(KEY_S);
    if (cur && cur.t > myT){
      stopped=true; saving=false;
      warn('המעבדה פתוחה בלשונית נוספת, והשמירה כאן נעצרה כדי לא לדרוס אותה. '
         + 'סגרו את הלשונית הזו, או רעננו אותה כדי להמשיך לעבוד כאן.');
      return;
    }
    const t = Date.now();
    const snap={v:SNAP_V,t}; SAVE_KEYS.forEach(k=>snap[k]=S[k]);
    await dbPut(KEY_S,snap); myT=t;
    const sig=sigOf();
    if (sig!==lastSig){
      const f={v:SNAP_V}; FILE_KEYS.forEach(k=>f[k]=S[k]);
      await dbPut(KEY_F,f); lastSig=sig;
    }
    warn('');
  }catch(e){
    warn('השמירה המקומית נכשלה — '+e.message+'. אל תסגרו את הלשונית לפני ההגשה.');
  }
  saving=false;
  if (again){ again=false; flush(); }
}
addEventListener('visibilitychange',()=>{
  if (document.visibilityState==='hidden'){ clearTimeout(saveT); flush(); } });
addEventListener('pagehide',()=>{ clearTimeout(saveT); flush(); });

const isObj = x => !!x && typeof x==='object' && !Array.isArray(x) && !(x instanceof File);
async function restore(){
  if (!CAN_SAVE) return;
  if (new URLSearchParams(location.search).has('reset')){
    try{ await dbDel(KEY_S); await dbDel(KEY_F); }catch(e){}
    return;
  }
  let st=null, fl=null;
  /* אם אי אפשר לקרוא, בוודאי אסור לדרוס: עוצרים את השמירה ואומרים זאת. */
  try{ st = await dbGet(KEY_S); }
  catch(e){ stopped=true;
    warn('אי אפשר לקרוא את השמירה המקומית ('+e.message+') — העבודה בלשונית הזו '
       + 'לא תישמר. אל תסגרו אותה לפני ההגשה.'); return; }
  try{ fl = await dbGet(KEY_F); }catch(e){}
  /* מיזוג מפתח-מפתח ולא החלפה של S: רשומה שנשמרה לפני ששדה נוסף עדיין
     נטענת, ומה שחסר בה פשוט נשאר בברירת המחדל. אף גרסה לא נזרקת. */
  if (st) SAVE_KEYS.forEach(k=>{ const v=st[k]; if (v===undefined) return;
    S[k] = (isObj(S[k])&&isObj(v)) ? Object.assign({},S[k],v) : v; });
  if (fl) FILE_KEYS.forEach(k=>{ const v=fl[k];
    if (isObj(v)) S[k]=Object.assign({},S[k],v); });
  lastSig = sigOf();
  myT = (st && st.t) || 0;   /* נקודת הייחוס לזיהוי לשונית שנייה */

  /* עקביות אחרי טעינה: עדיף "לא הועלה מודל" על כפתור הרצה שנופל. */
  ['A','B'].forEach(k=>{ if (!S.nfiles[k]) S.nmod[k]=null; });
  Object.keys(S.models).forEach(n=>{
    const m=S.models[n]; if (!m||!m.files||!m.files.length) delete S.models[n]; });
  if (!MET[S.metric]) S.metric='acc';
  if (!['how','why','trap','ask'].includes(S.armTab)) S.armTab='how';
  if (S.stage!==1 && S.stage!==2) S.stage=2;
  S.i = Math.max(0, Math.min(STEPS.length-1, S.i|0));
  while (S.i>0 && !avail(STEPS[S.i])) S.i--;
}

/* הציור לא מחכה לאחסון תקוע: אם IndexedDB לא ענה בשתי שניות וחצי,
   המעבדה נפתחת בלי שחזור — וכשהשחזור כן מגיע, היא מציירת שוב. */
let booted=false;
const boot = ()=>{ booted=true; render(); };
const bootT = setTimeout(()=>{ if(!booted) boot(); }, 2500);
restore().then(()=>{ clearTimeout(bootT); boot(); },
               ()=>{ clearTimeout(bootT); boot(); });
</script>

<!-- רקע דינמי. שכבה נפרדת לחלוטין: הקנבס הוא z-index:-1, כלומר מעל רקע העמוד
     ומתחת לכל התוכן, ולכן אף שורת CSS של המעבדה לא משתנה. אם הקובץ חסר
     (למשל בפתיחה ישירה מ-file://), המעבדה עובדת בדיוק כמו קודם. -->
<script type="module">
try {
  const { mountBackground } = await import('../../../js/background.js');
  /* ?bg=0.8 לכיול מהיר, ?bg=0 לכיבוי. ברירת המחדל 0.5. */
  const p = new URLSearchParams(location.search).get('bg');
  const intensity = p === null ? 0.5 : Math.max(0, Math.min(1, +p || 0));
  if (intensity > 0) mountBackground(document.body, { intensity, accent: true, seed: 7 });
} catch (e) { /* בלי רקע. לא שוברים את המעבדה בשביל שכבת רקע. */ }
</script>
