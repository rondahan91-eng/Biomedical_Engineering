<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המעבדה — דמו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   המעבדה — מסך אחד, משימה אחת.
   הכלל היחיד כאן: מה שלא צריך עכשיו אינו על המסך. ההסברים, המספרים
   והמלכודות קיימים — אבל נפתחים, לא מוצגים.
   שפת העיצוב נמדדה מתוך מצגת "עקומות למידה".
   ========================================================================== */
:root{
  --bg:#f6f9fb; --surface:#fff; --surface-2:#f1f6f9; --surface-3:#e7eff4;
  --line:#e0e9f0; --line-2:#ccdae5;
  --ink:#0d1f2b; --ink-2:#4a6478; --ink-3:#8aa2b3;
  --brand:#0891b2; --brand-2:#0e7490; --accent:#14b8a6;
  --ok:#059669; --warn:#b45309; --err:#dc2626;
  --font:'Heebo','Assistant','Segoe UI',Arial,sans-serif;
  --mono:'JetBrains Mono','Consolas',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;flex-direction:column;overflow:hidden}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;
  color:var(--ink-3);text-transform:uppercase;display:block;direction:ltr;text-align:right}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;
  transition:border-color .13s,background .13s,color .13s}
button:hover:not(:disabled){border-color:var(--ink);}
button:disabled{opacity:.35;cursor:not-allowed}
button.go{background:var(--ink);color:#fff;border-color:var(--ink);padding:11px 26px}
button.go:hover:not(:disabled){background:var(--brand-2);border-color:var(--brand-2)}
button.quiet{border-color:transparent;color:var(--ink-3);font-weight:500}
button.quiet:hover{color:var(--ink);border-color:transparent}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:9px;padding:12px 14px;width:100%;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}

/* ---------------- כותרת: ניווט בלבד, אפס תוכן ---------------- */
header{height:56px;flex:none;display:flex;align-items:center;gap:18px;
  padding:0 26px;background:var(--surface);border-bottom:1px solid var(--line)}
header .wk{font-weight:900;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
#steps{display:flex;gap:5px;margin-inline-start:auto;margin-inline-end:auto}
#steps button{border:0;background:transparent;padding:6px 3px;border-radius:0}
#steps b{display:block;width:30px;height:4px;border-radius:3px;background:var(--line-2)}
#steps button.done b{background:var(--ok)}
#steps button.on b{background:var(--ink)}
#steps button.lock b{background:var(--surface-3)}
#steps button:disabled{cursor:not-allowed}
header .who{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* ---------------- במה ---------------- */
main{flex:1;min-height:0;overflow-y:auto;display:flex;justify-content:center}
.stage{width:100%;max-width:960px;padding:32px 30px 16px;animation:in .22s ease-out}
/* רק אטימות. translateY בתוך מיכל גלילה מוסיף 6px של גלילה אמיתית, ומספיק
   כדי שפס גלילה יופיע על מסך שאמור להיות מסך אחד. */
@keyframes in{from{opacity:0}to{opacity:1}}
.stage h1{margin:7px 0 0;font-size:40px;font-weight:900;line-height:1.14;letter-spacing:-.6px}
.stage .lede{margin:12px 0 0;font-size:19px;font-weight:500;color:var(--ink-2);line-height:1.52;max-width:720px}
.work{margin-top:24px}

/* ---------------- כפתורי בחירה גדולים ---------------- */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;
  cursor:pointer;text-align:start}
.pick:hover{border-color:var(--ink-3)}
.pick.on{border-color:var(--ink);border-width:2px;padding:17px}
.pick.off{opacity:.42;cursor:not-allowed}
.pick .t{display:block;font-size:17px;font-weight:900;margin-top:6px;line-height:1.25}
.pick .s{display:block;font-size:13px;color:var(--ink-3);margin-top:5px;line-height:1.4}

/* ---------------- משבצות המדידה ---------------- */
.runs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.runs.two{grid-template-columns:repeat(2,1fr);max-width:430px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 12px;
  text-align:center;cursor:pointer}
.run:hover:not(.off){border-color:var(--ink-3)}
.run .n{font-family:var(--mono);font-size:19px;font-weight:700}
.run .s{font-size:12px;color:var(--ink-3);margin-top:6px;min-height:17px}
.run.on{border-color:var(--ink);border-width:2px;padding:15px 11px}
.run.done{background:#f3fbf7;border-color:#bfe8d4}
.run.done .n{color:var(--ok)}
.run.off{opacity:.38;cursor:not-allowed}
.runbar{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.runbar .lbl{font-size:13px;color:var(--ink-3)}

/* ---------------- הגרף ---------------- */
.chartwrap{position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px 10px}
#chart{width:100%;height:204px;display:block}
.chartfoot{display:flex;align-items:center;gap:16px;margin-top:4px;flex-wrap:wrap}
.chartfoot .k{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.chartfoot .k i{display:inline-block;width:14px;height:2px;margin-inline-end:5px;vertical-align:3px}
.metsel{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;
  margin-inline-start:auto}
.metsel button{border:0;border-radius:0;padding:5px 13px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.metsel button+button{border-inline-start:1px solid var(--line)}
.metsel button.on{background:var(--ink);color:#fff;font-weight:700}

/* המַדָּה */
#cal{position:absolute;width:52px;cursor:grab;touch-action:none;user-select:none;z-index:3}
#cal.drag{cursor:grabbing}
#cal .tip{position:absolute;top:-16px;inset-inline-start:50%;transform:translateX(50%);
  font-family:var(--mono);font-size:10px;color:var(--brand-2);white-space:nowrap}
#calsay{margin-top:14px;font-size:17px;font-weight:700;min-height:26px}
#calsay.over{color:var(--ok)} #calsay.under{color:var(--err)} #calsay.edge{color:var(--warn)}

/* ---------------- טבלת המספרים — נפתחת, לא מוצגת ---------------- */
.numsbtn{margin-top:14px}
#nums{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:none}
#nums.open{display:block}
#nums table{width:100%;border-collapse:collapse;direction:ltr}
#nums th,#nums td{font-family:var(--mono);font-size:13px;padding:6px 8px;text-align:center}
#nums th{color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line);font-size:11.5px}
#nums td.rl{direction:rtl;text-align:right;color:var(--ink-3);font-family:var(--font);font-size:12.5px}
#nums tr+tr td{border-top:1px solid var(--surface-2)}
#nums input{width:62px;padding:3px 0;text-align:center;font-family:var(--mono);font-size:13px;
  border-radius:5px}

/* ---------------- שונות ---------------- */
.gate{display:flex;gap:20px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.gate img{width:260px;height:190px;object-fit:cover;flex:none;display:block}
.gate .in{padding:20px 22px}
.gate ol{margin:10px 0 0;padding-inline-start:18px;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.gate code{font-family:var(--mono);font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink)}
.cells{display:flex;gap:16px;margin-top:4px}
.cellbox{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.cellbox canvas{width:150px;height:150px;border-radius:9px;display:block;margin:0 auto 10px}
.cellbox .t{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.cellbox .d{font-size:12px;color:var(--ink-3);margin-top:3px}
.fields{display:grid;gap:14px;max-width:720px}
.fields label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.stamp{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ok);
  border:1px solid #bfe8d4;background:#f3fbf7;border-radius:20px;padding:4px 12px}
.stamp.broken{color:var(--warn);border-color:#f6ddb4;background:#fff8ec}
.doneBig{text-align:center;padding:30px 0}
.doneBig .big{font-size:52px;font-weight:900;font-family:var(--mono);color:var(--ok)}

/* ---------------- כותרת תחתונה ---------------- */
footer{height:70px;flex:none;display:flex;align-items:center;gap:16px;padding:0 26px;
  background:var(--surface);border-top:1px solid var(--line)}
footer .hint{font-size:13px;color:var(--ink-3);margin-inline-end:auto}
footer .hint b{color:var(--warn);font-weight:700}

/* ---------------- הזרוע ---------------- */
#arm{position:fixed;z-index:60;left:26px;bottom:88px;width:52px;height:52px}
#armbtn{width:52px;height:52px;border-radius:50%;background:var(--ink);border:0;padding:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 10px rgba(13,31,43,.18)}
#armbtn svg{width:26px;height:26px}
/* inset-inline-END ולא start: ב-RTL הצד ה"מתחיל" הוא הימני, ופאנל של 340px
   שנתלה ממנו יוצא מהמסך שמאלה. כאן הוא נתלה מהקצה השמאלי ונפתח פנימה. */
#armpanel{position:absolute;bottom:62px;inset-inline-end:0;inset-inline-start:auto;
  width:min(340px,calc(100vw - 60px));background:var(--ink);
  border-radius:14px;padding:8px;display:none}
#armpanel.open{display:block}
#armgrab{height:14px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:grab}
#armgrab i{width:18px;height:2px;background:#466;border-radius:2px;display:block}
#armscreen{background:#062028;border-radius:10px;padding:13px 15px;color:#cfe7ee;
  font-size:13.5px;line-height:1.6;max-height:260px;overflow-y:auto}
#armscreen .eyebrow{color:#568798;margin-bottom:6px}
#armscreen h4{margin:0 0 3px;font-size:13px;color:#8fd8cd;font-weight:700}
#armscreen p{margin:0 0 11px}
#armscreen .pit{color:#f0b67a}
#armtabs{display:flex;gap:4px;margin-top:7px}
#armtabs button{flex:1;border:0;background:#13323d;color:#7fa8b6;font-size:12px;padding:6px 0;
  border-radius:7px;font-weight:700}
#armtabs button.on{background:var(--accent);color:#062028}
.askrow{display:flex;gap:5px;margin-top:9px}
.askrow input{background:#0b2c37;border-color:#1d4a5c;color:#dff3f8;font-size:13px;padding:8px 10px}
.askrow button{background:var(--accent);color:#062028;border:0;padding:7px 13px;font-size:13px}

/* מסך נמוך — מחשב כיתה. הכול מתכווץ יחד כדי שהמסך יישאר מסך אחד. */
@media (max-height:710px){
  header{height:50px} footer{height:60px}
  .stage{padding-top:22px}
  .stage h1{font-size:31px} .stage .lede{font-size:16.5px;margin-top:9px}
  .work{margin-top:18px}
  #chart{height:152px}
  .chartwrap{padding:12px 14px 8px}
  #calsay{font-size:15.5px;margin-top:10px;min-height:22px}
  .numsbtn{margin-top:8px}
  .run{padding:12px 10px} .run .n{font-size:17px} .run .s{margin-top:4px}
  .pick{padding:14px} .pick .t{font-size:15.5px}
  .cellbox canvas{width:118px;height:118px}
  #armscreen{max-height:190px}
  input,textarea{padding:9px 12px;font-size:15px}
}
@media (max-width:860px){
  .stage h1{font-size:30px} .stage .lede{font-size:17px}
  .runs{grid-template-columns:repeat(3,1fr)}
  .gate{flex-direction:column;align-items:stretch} .gate img{width:100%;height:120px}
}
</style>
</head>
<body>

<header>
  <span class="wk">שבוע עקומת הלמידה</span>
  <nav id="steps"></nav>
  <span class="who">דנה · י1 · שלב <b id="stg">2</b>
    <button class="quiet" id="stgBtn" style="padding:3px 7px;font-size:11px">החלף</button></span>
</header>

<main><div class="stage" id="stage"></div></main>

<footer>
  <button class="quiet" id="prev">← הקודם</button>
  <span class="hint" id="hint"></span>
  <button class="go" id="next">הבא →</button>
</footer>

<div id="arm">
  <div id="armpanel">
    <div id="armgrab"><i></i><i></i></div>
    <div id="armscreen"></div>
    <div id="armtabs">
      <button data-t="how" class="on">איך</button>
      <button data-t="why">למה</button>
      <button data-t="trap">מלכודת</button>
      <button data-t="ask">שאלה</button>
    </div>
  </div>
  <button id="armbtn" title="העוזר — איך, למה, מלכודת">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="7" width="16" height="11" rx="2.5"/><path d="M12 7V4M9 2.5h6"/>
      <circle cx="9" cy="12.5" r="1.3" fill="#5eead4" stroke="none"/>
      <circle cx="15" cy="12.5" r="1.3" fill="#5eead4" stroke="none"/>
    </svg>
  </button>
</div>

<script>
/* ========== המספרים. צורת curveReport מהשרת, בלי שינוי. ========== */
const PTS = [
  {n:25, acc:.610,sens:.520,spec:.700,TP:52,FN:48,FP:30,TN:70},
  {n:50, acc:.745,sens:.710,spec:.780,TP:71,FN:29,FP:22,TN:78},
  {n:100,acc:.880,sens:.860,spec:.900,TP:86,FN:14,FP:10,TN:90},
  {n:200,acc:.915,sens:.910,spec:.920,TP:91,FN:9, FP:8, TN:92},
  {n:400,acc:.925,sens:.920,spec:.930,TP:92,FN:8, FP:7, TN:93}
];
const NOISE_RUN = {n:100,acc:.855,sens:.840,spec:.870,TP:84,FN:16,FP:13,TN:87};
const MET = {acc:'דיוק', sens:'רגישות', spec:'ספציפיות'};
const noiseBand = m => Math.abs(PTS.find(p=>p.n===100)[m] - NOISE_RUN[m])*100;
const gaps = m => PTS.slice(1).map((p,i)=>({from:PTS[i].n,to:p.n,delta:(p[m]-PTS[i][m])*100}));
function plateauFrom(m){
  const g=gaps(m), nb=noiseBand(m);
  for(let i=0;i<g.length;i++) if(g.slice(i).every(x=>x.delta<=nb)) return g[i].from;
  return null;
}

/* ========== עשרת השלבים. הטקסטים הם אלה שבשרת. ========== */
const STEPS = [
  {id:'exp_marked', stage:1, kind:'declare',
   eyebrow:'EXPERIMENT', h:'איזה ניסוי את/ה מריץ/ה השבוע?',
   lede:'בחירה אחת. היא קובעת מה המנטור ישאל ומה המערכת תחפש.',
   why:'הניסוי המסומן הוא מה שהמנטור שואל עליו, והמחברת היא המקום שבו ההשערה ננעלת לפני המדידה.',
   how:'בחרו "עקומת למידה". אחר כך כתבו באיזה מאגר אתם עובדים.',
   trap:'ניסוי שמעבר לשלב הפתוח יידחה על ידי השרת — כפתור מושבת הוא בקשה, לא מניעה.'},

  {id:'sizes', stage:2, kind:'declare',
   eyebrow:'HOW MANY POINTS', h:'כמה גדלים באמת קיבלת?',
   lede:'עקומה שנעצרה כי הנתונים נגמרו אינה עקומה שהתיישרה. ספרו לפני שמודדים.',
   why:'אלה שני דברים שונים לגמרי, וחייבים להיכתב בנפרד.',
   how:'סמנו רק את הגדלים שבאמת נפתחו לכם ב-Drive.',
   trap:'להניח חמש נקודות. בשלב 1 פתוחות רק "גודל 0025" ו"ערכת מבחן".'},

  {id:'hypothesis', stage:1, kind:'declare',
   eyebrow:'PREDICT FIRST', h:'נחש/י את העקומה — לפני שמדדת',
   lede:'גררו את חמש הנקודות לאן שאתם חושבים שהן ינחתו. הקו שלכם יישאר על הגרף כל השבוע.',
   why:'השערה שנכתבת אחרי שרואים את התוצאה תמיד מתאמתת, וכך הניסוי מפסיק ללמד משהו.',
   how:'גררו את חמש הנקודות, ואז כתבו משפט אחד עם מספר ונעלו אותו.',
   trap:'השערה שאינה ניתנת להפרכה. "הדיוק ימשיך להשתפר" אינה השערה.'},

  {id:'noise', stage:1, kind:'auto',
   eyebrow:'THE NOISE RULER', h:'אותה ערכה. פעמיים.',
   lede:'שני אימונים על אותן תמונות בדיוק ייתנו תוצאות שונות. ההפרש ביניהם הוא הרעש של המדידה — והוא הסרגל של כל השבוע.',
   why:'בלי הסרגל הזה כל הפרש קטן הוא טענה בלי בסיס.',
   how:'אמנו פעמיים על אותה ערכה, הריצו את שניהם, וקלטו את שתי התוצאות.',
   trap:'לדלג על זה ואז לקרוא ל-1.5 נקודות "שיפור".'},

  {id:'models', stage:2, kind:'declare',
   eyebrow:'OUTSIDE · THE ONLY EXIT', h:'מודל נפרד לכל גודל',
   lede:'זה החלק היחיד שקורה מחוץ למעבדה. אותן הגדרות בדיוק בכל החמישה.',
   why:'כל נקודה על הגרף היא אימון נפרד. המודל של 100 אינו המודל של 50 שהשתפר.',
   how:'פרויקט חדש לכל גודל, אותם שמות קלאסים, וייצוא Tensorflow.js.',
   trap:'לשנות גם את מספר הסבבים "כי זה יותר תמונות". ולהתאכזב מ-97% כבר ב-25 — זה ממצא, לא כישלון.'},

  {id:'runs5', stage:2, kind:'auto',
   eyebrow:'FIVE POINTS', h:'חמש מדידות, אותה ערכת מבחן',
   lede:'לכל גודל: טענו את המודל, הריצו, וקלטו לגרף. הסף 0.50 בכולם.',
   why:'ההרצה השמורה היא הדבר היחיד שמצמיד יחד תווית, סף וארבעה תאים.',
   how:'לחצו על משבצת, "הרצה", ואז "קליטה לגרף".',
   trap:'שמירה בשני ספים שונים — הסף נצרב בתוך ההרצה בלי אזהרה.'},

  {id:'read3', stage:1, kind:'declare',
   eyebrow:'BIGGER THAN NOISE?', h:'האם הפער גדול מהרעש?',
   lede:'גררו את המַדָּה אל פער על העקומה. הלסתות שלה הן הרעש.',
   why:'הדיוק יכול להישאר קפוא בזמן שהרגישות עולה. ובעין, 3% הם כקוטר נקודה.',
   how:'גררו את המַדָּה אל כל אחד מארבעת הפערים, ואז החליפו מדד וראו מה קורה.',
   trap:'ציר ה-X הוא סדר השמירה ולא n: המרחק בין 25 ל-50 זהה למרחק בין 200 ל-400.'},

  {id:'maps', stage:1, kind:'declare',
   eyebrow:'DID THE FOCUS MOVE', h:'על מה המודל הסתכל?',
   lede:'אותה תמונה, שני מודלים. אם הדיוק עלה והקשב נשאר על המסגרת — מה ששיפרתם אינו האבחון.',
   why:'מודל שלמד קיצור דרך משתפר עם עוד נתונים בדיוק כמו מודל שלמד את הטפיל.',
   how:'השוו את שתי המפות: האם האזור זז, והאם הוא התכנס.',
   trap:'"מפת הקשב מראה שהמודל מבין" — היא רמז שמחייב בדיקה, לא הוכחה.'},

  {id:'conclusion', stage:1, kind:'declare',
   eyebrow:'CONCLUSION', h:'מה למדת — ומה אי אפשר לדעת מכאן',
   lede:'"המדידה לא הכריעה" היא תשובה לגיטימית, והיא מזכה.',
   why:'שתי מסקנות הפוכות מתאימות לאותם נתונים בדיוק.',
   how:'בחרו מסקנה, ואז כתבו מה הניסוי הזה לא יכול להוכיח.',
   trap:'"העקומה התיישרה אז הגעתי לתקרה" — הטעות המרכזית של השיעור.'},

  {id:'record', stage:1, kind:'soft',
   eyebrow:'KEEP IT', h:'תיוק',
   lede:'ההרצות יושבות בדפדפן הזה בלבד.',
   why:'"איפוס הרצות", או מחשב אחר, והן איננו.',
   how:'כפתור אחד.', trap:'להסתמך על הדפדפן. הוא לא מחסן.'}
];

/* ========== מצב ========== */
const S = {
  i:0, stage:2, metric:'acc',
  exp:null, sizes:[], runs:{}, sel:null, noiseA:false, noiseB:false,
  predict:{}, locked:null, broken:false,
  notes:{}, done:{}, prec:{}, cal:null, calXY:null,
  armOpen:false, armTab:'how', numsOpen:false, filed:0
};
const step = () => STEPS[S.i];
const avail = s => s.stage <= S.stage;
const captured = () => PTS.filter(p=>S.runs[p.n] && S.runs[p.n].cap).map(p=>p.n);
const noiseIn = () => S.noiseA && S.noiseB;

/* ========== כותרת ========== */
function renderSteps(){
  document.getElementById('steps').innerHTML = STEPS.map((s,i)=>
    `<button data-i="${i}" title="${s.h}"
      class="${S.done[s.id]?'done':''} ${i===S.i?'on':''} ${avail(s)?'':'lock'}"
      ${avail(s)?'':'disabled'}><b></b></button>`).join('');
  document.getElementById('stg').textContent = S.stage;
}

/* ========== הבמה ========== */
function render(){
  const s = step();
  renderSteps();
  document.getElementById('stage').innerHTML = `
    <span class="eyebrow">${('0'+(S.i+1)).slice(-2)} / 10 · ${s.eyebrow}</span>
    <h1>${s.h}</h1>
    <p class="lede">${s.lede}</p>
    <div class="work">${work(s)}</div>`;
  footer(s);
  armScreen();
  if (s.id==='maps') drawCells();
  if (document.getElementById('chart')) { drawChart(); placeCal(); }
}

function work(s){
  switch(s.id){
    case 'exp_marked': return wExp();
    case 'sizes':      return wSizes();
    case 'hypothesis': return wHyp();
    case 'noise':      return wNoise();
    case 'models':     return wModels();
    case 'runs5':      return wRuns();
    case 'read3':      return wRead();
    case 'maps':       return wMaps();
    case 'conclusion': return wConc();
    case 'record':     return wRec();
  }
}

const EXPS=[['curve','עקומת למידה','כמה תמונות באמת צריך'],
            ['balance','יחסי איזון','כשמחלקה אחת נדירה'],
            ['source','הכללה בין מקורות','הממצא או המקור'],
            ['intervention','התערבות','האם התיקון עובד']];
function wExp(){
  return `<div class="picks">${EXPS.map((e,i)=>`
      <button class="pick ${S.exp===e[0]?'on':''} ${i>0?'off':''}" data-exp="${e[0]}" ${i>0?'disabled':''}>
        <span class="eyebrow">${i===0?'OPEN':'LATER'}</span>
        <span class="t">${e[1]}</span><span class="s">${e[2]}</span></button>`).join('')}</div>
    ${S.exp?`<div style="margin-top:22px;max-width:620px">
      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px">באיזה מאגר?</label>
      <input data-note="exp_marked" value="${S.notes.exp_marked||''}"
        placeholder="מלריה — תאי דם · 5 בנובמבר"></div>`:''}`;
}

const SIZES=[25,50,100,200,400];
function wSizes(){
  return `<div class="picks" style="grid-template-columns:repeat(5,1fr)">
    ${SIZES.map(n=>{
      const open = n===25 || S.stage>=2;
      return `<button class="pick ${S.sizes.includes(n)?'on':''} ${open?'':'off'}"
        data-size="${n}" ${open?'':'disabled'} style="text-align:center">
        <span class="t num">${n}</span>
        <span class="s">${open?'נפתח':'שלב 2'}</span></button>`;}).join('')}</div>
    <p style="margin-top:18px;font-size:15px;color:var(--ink-2)">
      סימנת <b class="num">${S.sizes.length}</b> גדלים.
      ${S.sizes.length&&S.sizes.length<5?'<b style="color:var(--warn)">פחות מחמש נקודות — זה בסדר, רק צריך לכתוב את זה במסקנה.</b>':''}</p>`;
}

function wHyp(){
  return `${chart(true)}
    <div style="margin-top:22px;max-width:680px">
      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px">
        ועכשיו במילים — עם מספר</label>
      <input data-note="hypothesis" value="${S.notes.hypothesis||''}"
        ${S.locked?'disabled':''} placeholder="מ-200 ל-400 יתווספו פחות מ-3 נקודות דיוק">
      <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
        ${S.locked
          ? `<span class="stamp ${S.broken?'broken':''}">${S.broken?'נשבר · ':''}ננעל ${S.locked}</span>
             <button class="quiet" id="unlock">פתיחה לעריכה</button>`
          : `<button class="go" id="lock" ${/\d/.test(S.notes.hypothesis||'')&&(S.notes.hypothesis||'').length>=15?'':'disabled'}>נעילה</button>
             <span style="font-size:12.5px;color:var(--ink-3)">צריך מספר, ולפחות 15 תווים</span>`}
      </div></div>`;
}

function wNoise(){
  const slot=(k,on,lbl)=>`<button class="run ${on?'done':''} ${S.sel===k?'on':''}" data-noise="${k}">
      <span class="n">${lbl}</span><span class="s">${on?'נקלט':'ריק'}</span></button>`;
  return `<div class="runs two">${slot('A',S.noiseA,'אימון א׳')}${slot('B',S.noiseB,'אימון ב׳')}</div>
    ${S.sel&&!(S.sel==='A'?S.noiseA:S.noiseB)
      ? `<div class="runbar"><button class="go" id="runOne">הרצה וקליטה</button>
         <span class="lbl">אותה ערכת מבחן · סף 0.50</span></div>`:''}
    ${noiseIn()?`<div style="margin-top:26px" class="chartwrap">
        <div style="text-align:center;padding:14px 0">
          <span class="eyebrow">NOISE BAND</span>
          <div style="font-size:52px;font-weight:900;font-family:var(--mono);color:var(--brand-2);line-height:1.1">
            ${noiseBand(S.metric).toFixed(1)}</div>
          <div style="font-size:16px;color:var(--ink-2);margin-top:4px">
            נקודות ${MET[S.metric]} — זה הרעש שלכם</div>
          <div style="font-size:14px;color:var(--ink-3);margin-top:10px;max-width:520px;margin-inline:auto">
            כל הפרש קטן מזה בין שתי נקודות על העקומה אינו ניתן להבחנה ממקריות.</div>
        </div></div>`:''}`;
}

function wModels(){
  return `<div class="gate">
      <img src="img/curve-slides.jpg" alt="">
      <div class="in">
        <span class="eyebrow">TEACHABLE MACHINE</span>
        <ol>
          <li>פרויקט חדש · Image Project · Standard</li>
          <li>שמות הקלאסים בדיוק כך: <code>נגוע</code> · <code>תקין</code></li>
          <li>Export ← <code>Tensorflow.js</code> ← Download</li>
        </ol>
        <button class="go" id="openTM" style="margin-top:16px">פתיחת Teachable Machine</button>
      </div></div>
    <div style="margin-top:20px;max-width:680px">
      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px">
        כמה מודלים אימנת, ומה נשאר זהה בכולם?</label>
      <input data-note="models" value="${S.notes.models||''}"
        placeholder="חמישה · אותם קלאסים, אותם Epochs, אותו Batch size"></div>`;
}

function wRuns(){
  const sel = S.sel;
  const r = sel && S.runs[sel] && S.runs[sel].res;
  return `<div class="runs">${SIZES.map(n=>{
      const open = n===25||S.stage>=2, st = S.runs[n]||{};
      return `<button class="run ${st.cap?'done':''} ${sel===n?'on':''} ${open?'':'off'}"
        data-run="${n}" ${open?'':'disabled'}>
        <span class="n">n=${n}</span>
        <span class="s">${st.cap?'על הגרף':(open?'ריק':'שלב 2')}</span></button>`;}).join('')}</div>
    ${sel&&!(S.runs[sel]||{}).cap?`<div class="runbar">
        ${r?`<button class="go" id="cap">קליטה לגרף ←</button>
             <span class="lbl num">${MET[S.metric]} ${(r[S.metric]*100).toFixed(1)}%</span>`
           :`<button class="go" id="runOne">הרצה על ערכת המבחן</button>
             <span class="lbl">200 תמונות · סף 0.50</span>`}</div>`:''}
    ${captured().length?`<div style="margin-top:26px">${chart(false)}</div>`:''}`;
}

function wRead(){
  return `${chart(false)}
    <div id="calsay" class="${S.cal==null?'':calState().cls}">${calSay()}</div>
    <button class="quiet numsbtn" id="numsBtn">${S.numsOpen?'סגירת המספרים':'הצגת המספרים'}</button>
    <div id="nums" class="${S.numsOpen?'open':''}">${numsTable()}</div>
    <div style="margin-top:20px;max-width:680px">
      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px">
        בין איזה שתי נקודות העקומה התיישרה, ובכמה?</label>
      <input data-note="read3" value="${S.notes.read3||''}"
        placeholder="בין 200 ל-400 — הפער 1.0 נקודות, קטן מהרעש 2.5"></div>`;
}

function wMaps(){
  return `<div class="cells">
      <div class="cellbox"><canvas id="m25" width="150" height="150"></canvas>
        <div class="t">n=25</div><div class="d">קשב פרוס · גם על השוליים</div></div>
      <div class="cellbox"><canvas id="m400" width="150" height="150"></canvas>
        <div class="t">n=400</div><div class="d">מתכנס לכתם אחד</div></div>
    </div>
    <p style="font-size:12px;color:var(--warn);font-family:var(--mono);margin-top:8px">
      דמו — המפות חושבו מראש</p>
    <div style="margin-top:18px;max-width:680px">
      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px">
        על מה הסתכל הקטן, על מה הגדול?</label>
      <input data-note="maps" value="${S.notes.maps||''}"
        placeholder="הקטן על כל התא, הגדול על הכתם — האזור התכנס"></div>`;
}

const VERDICTS=['המדידה לא הכריעה','התאמתה','התאמתה חלקית','הופרכה'];
function wConc(){
  return `<div class="picks" style="grid-template-columns:repeat(4,1fr)">
      ${VERDICTS.map(v=>`<button class="pick ${S.notes.verdict===v?'on':''}" data-verdict="${v}"
        style="text-align:center"><span class="t" style="font-size:15px">${v}</span></button>`).join('')}</div>
    <div class="fields" style="margin-top:20px">
      <div><label>מה הניסוי הזה לא יכול להוכיח?</label>
        <textarea data-note="conclusion" style="height:84px"
          placeholder="גודל ערכת המבחן · מאגר יחיד · אותו מקור · רעש התיוג">${S.notes.conclusion||''}</textarea></div>
    </div>`;
}

function wRec(){
  return S.filed
    ? `<div class="doneBig"><div class="big">${S.filed}</div>
        <div style="font-size:17px;color:var(--ink-2);margin-top:6px">תוצרים תויקו</div></div>`
    : `<button class="go" id="fileAll" style="font-size:16px;padding:14px 30px">תיוק כל התוצרים</button>`;
}

/* ========== הגרף ========== */
function chart(editable){
  return `<div class="chartwrap">
      <svg id="chart" viewBox="0 0 640 230" preserveAspectRatio="none"
        data-edit="${editable?1:0}"></svg>
      <div class="chartfoot">
        <span class="k"><i style="background:var(--ink)"></i>נמדד</span>
        <span class="k"><i style="background:var(--brand);opacity:.6"></i>הניבוי שלך</span>
        ${noiseIn()?`<span class="k"><i style="background:#cbd9e2;height:9px"></i>רעש ${noiseBand(S.metric).toFixed(1)}</span>`:''}
        <div class="metsel">${Object.keys(MET).map(m=>
          `<button data-met="${m}" class="${S.metric===m?'on':''}">${MET[m]}</button>`).join('')}</div>
      </div>
      ${step().id==='read3'&&noiseIn()?`<div id="cal"><span class="tip">מַדָּה</span></div>`:''}
    </div>`;
}
const CX={x0:52,x1:614,y0:16,y1:186};
const px = i => CX.x0 + i*(CX.x1-CX.x0)/4;
const py = v => CX.y1 - (v-.5)/.5*(CX.y1-CX.y0);
function drawChart(){
  const el = document.getElementById('chart'); if(!el) return;
  const m = S.metric; let s='';
  for(let v=.5;v<=1.001;v+=.1){
    s+=`<line x1="${CX.x0}" y1="${py(v)}" x2="${CX.x1}" y2="${py(v)}" stroke="#eef3f7"/>
        <text x="${CX.x0-10}" y="${py(v)+4}" font-size="11" fill="#8aa2b3" text-anchor="end"
          font-family="JetBrains Mono,monospace">${Math.round(v*100)}</text>`;
  }
  PTS.forEach((p,i)=> s+=`<text x="${px(i)}" y="${CX.y1+22}" font-size="12" fill="#8aa2b3"
    text-anchor="middle" font-family="JetBrains Mono,monospace">${p.n}</text>`);

  const pr = PTS.map((p,i)=> S.predict[p.n]==null?null:[px(i),py(S.predict[p.n])]);
  if (pr.every(Boolean))
    s+=`<polyline points="${pr.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#0891b2"
        stroke-width="2" stroke-dasharray="6 4" opacity=".65"/>`;
  pr.forEach(q=>{ if(q) s+=`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="#fff" stroke="#0891b2"
      stroke-width="2.2" opacity=".85"/>`; });

  const caps = captured();
  if (noiseIn()){
    const h=(CX.y1-CX.y0)*(noiseBand(m)/100)/.5;
    caps.forEach(n=>{ const i=PTS.findIndex(p=>p.n===n);
      s+=`<rect x="${px(i)-14}" y="${py(PTS[i][m])-h/2}" width="28" height="${h}"
        fill="#cbd9e2" opacity=".6" rx="3"/>`; });
  }
  const dots = PTS.map((p,i)=> caps.includes(p.n)?[px(i),py(p[m])]:null).filter(Boolean);
  if (dots.length>1) s+=`<polyline points="${dots.map(q=>q.join(',')).join(' ')}" fill="none"
      stroke="#0d1f2b" stroke-width="2.6"/>`;
  dots.forEach(q=> s+=`<circle cx="${q[0]}" cy="${q[1]}" r="5.5" fill="#0d1f2b"/>`);

  if (step().id==='read3' && S.cal!=null){
    const i=S.cal, g=gaps(m)[i], h=(CX.y1-CX.y0)*(noiseBand(m)/100)/.5;
    const xm=(px(i)+px(i+1))/2, ym=(py(PTS[i][m])+py(PTS[i+1][m]))/2;
    const dh=(CX.y1-CX.y0)*(g.delta/100)/.5;
    s+=`<line x1="${xm}" y1="${ym-dh/2}" x2="${xm}" y2="${ym+dh/2}" stroke="#0d1f2b" stroke-width="2.6"/>
        <line x1="${xm-17}" y1="${ym-h/2}" x2="${xm+17}" y2="${ym-h/2}" stroke="#0e7490" stroke-width="3"/>
        <line x1="${xm-17}" y1="${ym+h/2}" x2="${xm+17}" y2="${ym+h/2}" stroke="#0e7490" stroke-width="3"/>
        <line x1="${xm}" y1="${ym-h/2}" x2="${xm}" y2="${ym+h/2}" stroke="#0e7490" stroke-width="1.2"
          stroke-dasharray="3 3"/>`;
  }
  if (step().id==='read3'){
    gaps(m).forEach((g,i)=>{ if(!(caps.includes(g.from)&&caps.includes(g.to))) return;
      s+=`<rect data-gap="${i}" x="${px(i)}" y="${CX.y0}" width="${px(i+1)-px(i)}"
        height="${CX.y1-CX.y0}" fill="transparent"/>`; });
  }
  el.innerHTML = s;
}
function calState(){
  const m=S.metric, g=gaps(m)[S.cal], r=g.delta/noiseBand(m);
  if (r>1.2) return {cls:'over', t:'גדול מהרעש — הפער אמיתי'};
  if (r>=.8) return {cls:'edge', t:'על גבול הרעש'};
  return {cls:'under', t:'קטן מהרעש — המדידה לא הכריעה'};
}
function calSay(){
  if (!noiseIn()) return '';
  if (S.cal==null) return '<span style="color:var(--ink-3);font-weight:500">גררו את המַדָּה אל פער בין שתי נקודות</span>';
  const m=S.metric, g=gaps(m)[S.cal];
  return `${g.from}→${g.to}: <span class="num">${g.delta.toFixed(1)}</span> נק׳ · רעש <span class="num">${noiseBand(m).toFixed(1)}</span> — ${calState().t}`;
}
function placeCal(){
  const c=document.getElementById('cal'); if(!c) return;
  const svg=document.getElementById('chart').getBoundingClientRect();
  const wrap=document.querySelector('.chartwrap').getBoundingClientRect();
  const h=Math.max(14,(CX.y1-CX.y0)*(noiseBand(S.metric)/100)/.5*(svg.height/230));
  if (!S.calXY) S.calXY={x:svg.left-wrap.left+14, y:svg.top-wrap.top+svg.height*0.52};
  c.style.left=S.calXY.x+'px'; c.style.top=S.calXY.y+'px'; c.style.height=(h+18)+'px';
  c.innerHTML=`<span class="tip">מַדָּה · ${noiseBand(S.metric).toFixed(1)}</span>
    <svg width="52" height="${h+18}" style="overflow:visible">
      <line x1="26" y1="9" x2="26" y2="${h+9}" stroke="#0e7490" stroke-width="1.4" stroke-dasharray="3 3"/>
      <line x1="6" y1="9" x2="46" y2="9" stroke="#0e7490" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="6" y1="${h+9}" x2="46" y2="${h+9}" stroke="#0e7490" stroke-width="3.4" stroke-linecap="round"/>
    </svg>`;
}
function numsTable(){
  const caps=captured();
  const head=`<tr><th></th>${caps.map(n=>`<th>n=${n}</th>`).join('')}${noiseIn()?'<th>רעש</th>':''}</tr>`;
  const row=(lbl,f)=>`<tr><td class="rl">${lbl}</td>${caps.map(n=>
      `<td>${f(PTS.find(p=>p.n===n))}</td>`).join('')}${noiseIn()?`<td>${f(NOISE_RUN)}</td>`:''}</tr>`;
  return `<table>${head}
    ${row('דיוק',p=>(p.acc*100).toFixed(1))}
    ${row('רגישות',p=>(p.sens*100).toFixed(1))}
    ${row('ספציפיות',p=>(p.spec*100).toFixed(1))}
    ${row('TP / FP',p=>p.TP+' / '+p.FP)}
    <tr><td class="rl">דיוק חיובי — חשבו</td>${caps.map(n=>
      `<td><input data-prec="${n}" value="${S.prec[n]==null?'':S.prec[n]}" placeholder="?"></td>`).join('')}
      ${noiseIn()?'<td>—</td>':''}</tr></table>`;
}

/* מפות קשב מזויפות אך עקביות */
function drawCells(){
  [['m25',.25,'07'],['m400',.9,'07']].forEach(([id,focus,n])=>{
    const c=document.getElementById(id); if(!c) return;
    const g=c.getContext('2d'); const im=new Image();
    im.onload=()=>{ g.drawImage(im,0,0,150,150);
      const k = focus>.5?9:34;
      for(let i=0;i<k;i++){
        const a=i*2.399, r=(1-focus)*62*Math.sqrt(i/k);
        const x=75+Math.cos(a)*r, y=75+Math.sin(a)*r;
        const rg=g.createRadialGradient(x,y,0,x,y,22);
        rg.addColorStop(0,'rgba(20,184,166,.42)'); rg.addColorStop(1,'rgba(20,184,166,0)');
        g.fillStyle=rg; g.fillRect(x-22,y-22,44,44);
      }};
    im.src='../../features/samples/נגוע/'+n+'.png';
  });
}

/* ========== כותרת תחתונה ========== */
function canAdvance(){
  const s=step();
  if (s.kind==='auto') return s.id==='noise' ? noiseIn() : captured().length>=5;
  if (s.id==='exp_marked') return S.exp && (S.notes.exp_marked||'').trim().length>=12;
  if (s.id==='sizes')      return S.sizes.length>0;
  if (s.id==='hypothesis') return !!S.locked;
  if (s.id==='conclusion') return !!S.notes.verdict && (S.notes.conclusion||'').trim().length>=12;
  if (s.id==='record')     return true;
  return (S.notes[s.id]||'').trim().length>=12;
}
function footer(s){
  const ok = canAdvance();
  document.getElementById('prev').disabled = S.i===0;
  const nx = document.getElementById('next');
  nx.disabled = !ok && s.id!=='record';
  nx.textContent = S.i===STEPS.length-1 ? 'סיום' : 'הבא →';
  const hints = {
    exp_marked:'בחרו ניסוי וכתבו באיזה מאגר',
    sizes:'סמנו את הגדלים שבאמת נפתחו',
    hypothesis:'גררו חמש נקודות, ואז נעלו משפט עם מספר',
    noise:'שני אימונים על אותה ערכה',
    models:'חמישה מודלים, אותן הגדרות',
    runs5:'חמש קליטות לגרף',
    read3:'גררו את המַדָּה אל פער',
    maps:'השוו את שתי המפות',
    conclusion:'בחרו מסקנה וכתבו מגבלה אחת',
    record:'כפתור אחד'
  };
  document.getElementById('hint').innerHTML = ok
    ? '<b style="color:var(--ok)">מוכן להמשיך</b>' : hints[s.id];
}

/* ========== הזרוע ========== */
function armScreen(){
  const s=step(), el=document.getElementById('armscreen');
  const T={how:['איך עושים',s.how],why:['למה זה חשוב',s.why],trap:['המלכודת',s.trap]};
  if (S.armTab==='ask'){
    el.innerHTML = `<span class="eyebrow">ASK</span>
      <p id="askOut">שאלה אחת, על מה שעל המסך.</p>
      <div class="askrow"><input id="askIn" placeholder="למה 1.0 נקודות זה לא שיפור?">
        <button id="askGo">שאל</button></div>`;
  } else {
    const [h,b]=T[S.armTab];
    el.innerHTML = `<span class="eyebrow">STEP ${S.i+1}</span>
      <h4>${h}</h4><p class="${S.armTab==='trap'?'pit':''}">${b}</p>`;
  }
  document.querySelectorAll('#armtabs button').forEach(b=>
    b.classList.toggle('on', b.dataset.t===S.armTab));
  document.getElementById('armpanel').classList.toggle('open', S.armOpen);
}
const CANNED='כי סרגל הרעש שלכם הוא 2.5 נקודות — שני אימונים על אותן תמונות בדיוק נבדלים ביותר מזה. הפרש של 1.0 קטן מהרעש, ולכן אי אפשר להבחין בינו לבין מקריות. נסו להחליף את המדד לספציפיות ולראות מה קורה לתשובה.';

/* ========== חיווט, בהאצלה אחת ========== */
function go(d){
  let j=S.i+d;
  while (j>=0 && j<STEPS.length && !avail(STEPS[j])) j+=d;
  if (j<0||j>=STEPS.length) return;
  if (d>0 && canAdvance()) S.done[step().id]=true;
  S.i=j; S.sel=null; render();
}
document.addEventListener('click', e=>{
  const T=s=>e.target.closest(s); let el;
  if ((el=T('#steps button'))){ S.i=+el.dataset.i; S.sel=null; render(); return; }
  if (T('#next')){ go(1); return; }
  if (T('#prev')){ go(-1); return; }
  if (T('#stgBtn')){ S.stage=S.stage===2?1:2; if(!avail(step())) S.i=0; render(); return; }
  if (T('#armbtn')){ S.armOpen=!S.armOpen; armScreen(); return; }
  if ((el=T('#armtabs button'))){ S.armTab=el.dataset.t; armScreen();
    if (S.armTab==='ask') setTimeout(()=>{
      const g=document.getElementById('askGo'); if(!g) return;
      g.onclick=()=>{ const o=document.getElementById('askOut'); o.textContent=''; let i=0;
        const t=setInterval(()=>{o.textContent=CANNED.slice(0,i+=2); if(i>=CANNED.length)clearInterval(t);},11); };
    },0); return; }
  if ((el=T('[data-exp]'))){ S.exp=el.dataset.exp; render(); return; }
  if ((el=T('[data-size]'))){ const n=+el.dataset.size;
    S.sizes = S.sizes.includes(n)?S.sizes.filter(x=>x!==n):S.sizes.concat(n).sort((a,b)=>a-b);
    render(); return; }
  if ((el=T('[data-met]'))){ S.metric=el.dataset.met; render(); return; }
  if ((el=T('[data-verdict]'))){ S.notes.verdict=el.dataset.verdict; render(); return; }
  if ((el=T('[data-noise]'))){ S.sel=el.dataset.noise; render(); return; }
  if ((el=T('[data-run]'))){ S.sel=+el.dataset.run; render(); return; }
  if (T('#runOne')){
    const s=step();
    if (s.id==='noise'){ if(S.sel==='A') S.noiseA=true; else S.noiseB=true; S.sel=null;
      if(noiseIn()) S.done.noise=true; }
    else { S.runs[S.sel]=S.runs[S.sel]||{}; S.runs[S.sel].res=PTS.find(p=>p.n===S.sel); }
    render(); return; }
  if (T('#cap')){ S.runs[S.sel].cap=true; S.sel=null;
    if(captured().length>=5) S.done.runs5=true; render(); return; }
  if (T('#lock')){ const d=new Date();
    S.locked=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); render(); return; }
  if (T('#unlock')){ S.broken=true; S.locked=null; render(); return; }
  if (T('#numsBtn')){ S.numsOpen=!S.numsOpen; render(); return; }
  if (T('#openTM')){ window.open('https://teachablemachine.withgoogle.com/train/image','_blank','noopener,noreferrer'); return; }
  if (T('#fileAll')){ S.filed=4; S.done.record=true; render(); return; }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if (t.dataset.note!=null){ S.notes[t.dataset.note]=t.value; footer(step());
    if (t.dataset.note==='hypothesis'){
      const b=document.getElementById('lock');
      if (b) b.disabled = !(/\d/.test(t.value)&&t.value.length>=15); } return; }
  if (t.dataset.prec!=null){ const n=+t.dataset.prec, p=PTS.find(x=>x.n===n);
    const truth=100*p.TP/(p.TP+p.FP);
    S.prec[n]=t.value===''?null:parseFloat(t.value);
    t.style.color = S.prec[n]==null?'var(--ink-3)'
      :(Math.abs(S.prec[n]-truth)<=0.1?'var(--ok)':'var(--err)'); }
});

/* גרירת נקודות הניבוי */
document.addEventListener('pointerdown', e=>{
  const svg = e.target.closest('#chart');
  if (!svg || svg.dataset.edit!=='1' || S.locked) return;
  const r=svg.getBoundingClientRect();
  const rx=(e.clientX-r.left)/r.width*640;
  let best=0,bd=1e9;
  for(let i=0;i<5;i++){ const d=Math.abs(px(i)-rx); if(d<bd){bd=d;best=i;} }
  if (bd>54) return;
  const n=PTS[best].n;
  const mv=ev=>{ const yy=(ev.clientY-r.top)/r.height*230;
    S.predict[n]=Math.max(.5,Math.min(1,.5+(CX.y1-yy)/(CX.y1-CX.y0)*.5)); drawChart(); };
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    footer(step());};
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); mv(e);
});

/* גרירת המַדָּה */
document.addEventListener('pointerdown', e=>{
  const c=e.target.closest('#cal'); if(!c) return;
  const d={dx:e.clientX-S.calXY.x, dy:e.clientY-S.calXY.y};
  c.classList.add('drag'); c.setPointerCapture(e.pointerId);
  const mv=ev=>{ S.calXY={x:ev.clientX-d.dx, y:ev.clientY-d.dy};
    c.style.left=S.calXY.x+'px'; c.style.top=S.calXY.y+'px'; };
  const up=ev=>{ c.classList.remove('drag');
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    const svg=document.getElementById('chart').getBoundingClientRect();
    const rel=(ev.clientX-svg.left)/svg.width*640; const caps=captured();
    S.cal=null;
    for(let i=0;i<4;i++){ const g=gaps(S.metric)[i];
      if (rel>=px(i)&&rel<=px(i+1)&&caps.includes(g.from)&&caps.includes(g.to)){ S.cal=i; break; } }
    drawChart();
    const say=document.getElementById('calsay');
    say.className=S.cal==null?'':calState().cls; say.innerHTML=calSay();
    footer(step()); };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
});

/* גרירת הזרוע */
(function(){
  const arm=document.getElementById('arm');
  document.addEventListener('pointerdown', e=>{
    if (!e.target.closest('#armgrab')) return;
    const r=arm.getBoundingClientRect(); const d={dx:e.clientX-r.left, dy:e.clientY-r.top};
    const mv=ev=>{ arm.style.left=Math.max(8,Math.min(innerWidth-70,ev.clientX-d.dx))+'px';
      arm.style.top=Math.max(70,Math.min(innerHeight-70,ev.clientY-d.dy))+'px';
      arm.style.bottom='auto'; };
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  });
})();
window.addEventListener('keydown', e=>{
  if (e.key==='Escape'){ S.armOpen=false; armScreen(); }
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='ArrowLeft') go(1);
  if (e.key==='ArrowRight') go(-1);
});
window.addEventListener('resize',()=>{ if(document.getElementById('chart')){drawChart();} });
render();
</script>
